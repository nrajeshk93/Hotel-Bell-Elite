<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:"Noto Sans";font-style:normal;font-weight:400;src:url("../../static/fonts/noto-sans-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Noto Sans";font-style:normal;font-weight:700;src:url("../../static/fonts/noto-sans-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:"Noto Sans";font-style:normal;font-weight:800;src:url("../../static/fonts/noto-sans-latin-800-normal.woff2") format("woff2")}
@font-face{font-family:"Inter";font-style:normal;font-weight:400;src:url("../../static/fonts/inter-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Inter";font-style:normal;font-weight:700;src:url("../../static/fonts/inter-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:"Inter";font-style:normal;font-weight:800;src:url("../../static/fonts/inter-latin-800-normal.woff2") format("woff2")}
@font-face{font-family:"Manrope";font-style:normal;font-weight:400;src:url("../../static/fonts/manrope-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Manrope";font-style:normal;font-weight:700;src:url("../../static/fonts/manrope-latin-700-normal.woff2") format("woff2")}
body{margin:20px;background:#fff;color:#000}
.row{display:flex;gap:24px;margin-bottom:28px;align-items:flex-end}
.cell{text-align:center}
.label{font:12px monospace;margin-bottom:6px;color:#333}
.big{font-size:120px;line-height:1;letter-spacing:0}
.med{font-size:48px;line-height:1;letter-spacing:0.04em}
.amt{font-size:36px;line-height:1;letter-spacing:0.04em}
</style>
</head>
<body>
<h2>Digit 6 tip comparison (thermal-relevant sizes)</h2>
<div class="row">
  <div class="cell"><div class="label">Noto 400</div><div class="big" style='font-family:"Noto Sans";font-weight:400'>6</div></div>
  <div class="cell"><div class="label">Noto 700</div><div class="big" style='font-family:"Noto Sans";font-weight:700'>6</div></div>
  <div class="cell"><div class="label">Noto 800</div><div class="big" style='font-family:"Noto Sans";font-weight:800'>6</div></div>
</div>
<div class="row">
  <div class="cell"><div class="label">Inter 400</div><div class="big" style='font-family:"Inter";font-weight:400'>6</div></div>
  <div class="cell"><div class="label">Inter 700</div><div class="big" style='font-family:"Inter";font-weight:700'>6</div></div>
  <div class="cell"><div class="label">Inter 800</div><div class="big" style='font-family:"Inter";font-weight:800'>6</div></div>
</div>
<div class="row">
  <div class="cell"><div class="label">Manrope 400</div><div class="big" style='font-family:"Manrope";font-weight:400'>6</div></div>
  <div class="cell"><div class="label">Manrope 700</div><div class="big" style='font-family:"Manrope";font-weight:700'>6</div></div>
</div>
<div class="row">
  <div class="cell"><div class="label">Noto 700 amt</div><div class="amt" style='font-family:"Noto Sans";font-weight:700'>₹660.00</div></div>
  <div class="cell"><div class="label">Inter 700 amt</div><div class="amt" style='font-family:"Inter";font-weight:700'>₹660.00</div></div>
  <div class="cell"><div class="label">Manrope 700 amt</div><div class="amt" style='font-family:"Manrope";font-weight:700'>₹660.00</div></div>
</div>
<div class="row">
  <div class="cell"><div class="label">Noto 400 660</div><div class="med" style='font-family:"Noto Sans";font-weight:400'>660.00</div></div>
  <div class="cell"><div class="label">Inter 400 660</div><div class="med" style='font-family:"Inter";font-weight:400'>660.00</div></div>
  <div class="cell"><div class="label">Manrope 400 660</div><div class="med" style='font-family:"Manrope";font-weight:400'>660.00</div></div>
</div>
</body>
</html>
