<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Hotel Bell Elite — Change Password</title>
  {% include 'partials/de_android_head.html' %}
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ asset('login_premium.css') }}" />
</head>
<body class="login-page">
  <div class="login-shell">
    <aside class="login-brand" aria-hidden="false">
      <div class="login-brand-media" style="--login-hero:url('{{ asset('login_hero.jpg') }}')"></div>
      <div class="login-brand-veil" aria-hidden="true"></div>
      <div class="login-brand-inner">
        <div class="login-brand-top">
          <img class="login-mark login-mark--on-dark" src="{{ url_for('static', filename='hbe_mark_sm.png') }}" width="72" height="72" alt="" />
          <h1 class="login-brand-name">Hotel Bell Elite</h1>
          <p class="login-brand-tag">Experience excellence</p>
        </div>
        <div class="login-brand-copy">
          <h2 class="login-welcome">Almost there</h2>
          <p class="login-welcome-sub">Choose a new password to finish signing in</p>
        </div>
      </div>
    </aside>

    <main class="login-panel">
      <div class="login-panel-card">
        <div class="login-panel-head">
          <img class="login-mark login-mark--badge" src="{{ asset('hbe_mark_form_sm.png') }}" width="88" height="88" alt="Hotel Bell Elite" />
          <h2 class="login-panel-title">Change password</h2>
          <p class="login-panel-sub">Your temporary password must be replaced before you continue.</p>
        </div>

        {% if error %}
          <div class="login-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('change_password') }}" class="login-form" autocomplete="off">
          <div class="form-group">
            <label for="new_password">New password</label>
            <div class="login-field">
              <span class="login-field-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V8a4 4 0 0 1 8 0v2"/></svg>
              </span>
              <input type="password" id="new_password" name="new_password" placeholder="Enter a new password" minlength="8" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}" title="At least 8 characters, with one uppercase letter, one lowercase letter, one number, and one special character." autocomplete="new-password" required />
            </div>
          </div>
          <div class="form-group">
            <label for="confirm_password">Confirm password</label>
            <div class="login-field">
              <span class="login-field-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V8a4 4 0 0 1 8 0v2"/></svg>
              </span>
              <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter new password" autocomplete="new-password" required />
            </div>
          </div>
          <button type="submit" class="login-btn">Save and continue</button>
        </form>

        <p class="login-panel-sub" style="margin-top:18px;text-align:center">
          <form method="POST" action="{{ url_for('logout') }}" style="display:inline" data-de-no-soft-nav="1">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="de-logout-btn" data-de-no-soft-nav="1" style="color:#64748B;font-weight:600;text-decoration:none;background:none;border:0;cursor:pointer;font:inherit">Sign out</button>
          </form>
        </p>
      </div>
    </main>
  </div>
</body>
</html>
