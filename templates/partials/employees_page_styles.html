<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --sw:230px;--th:60px;
  --bg:#F4F6F9;--card:#FFFFFF;--border:#E2E8F0;--border-s:#EEF2F7;
  --acc:#1877F2;--acc-h:#1560D4;--acc-bg:#EEF5FF;
  --sb-bg:#FFFFFF;--sb-txt:#64748B;--sb-act:#1877F2;
  --txt:#1A202C;--txt2:#4A5568;--txt3:#94A3B8;--entry:#FFFFFF;
  --ok:#16A34A;--ok-bg:#F0FDF4;--err:#DC2626;--err-bg:#FEF2F2;
  --warn:#D97706;--warn-bg:#FFFBEB;--pur:#7C3AED;--pur-bg:#F5F3FF;
  --aim-blue:rgba(66,133,244,.92);--aim-green:rgba(52,168,83,.9);
  --aim-yellow:rgba(251,188,5,.92);--aim-red:rgba(234,67,53,.9);
  --aim-blur:5px;--aim-ring:2px;
  --sh:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --sh2:0 4px 16px rgba(0,0,0,.06);--r:10px;--rs:6px;
}
html,body{min-height:100vh;background:var(--bg);color:var(--txt);font-family:'Inter','Segoe UI',system-ui,sans-serif;font-size:14px;line-height:1.5;}

@property --aim-angle{
  syntax:"<angle>";
  inherits:false;
  initial-value:0deg;
}

@keyframes ai-hover-border-sweep{
  to{--aim-angle:360deg;}
}

/* ── App shell ── */
.app-shell{display:flex;min-height:100vh;}

/* Legacy sidebar styles replaced by de_workspace_shell.css on payroll pages */
/* ── Main wrapper ── */
.main-wrapper{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh;}

/* ── Sidebar collapsed state ── */
body.sb-off #ep-workspace.de-module .de-sidebar{transform:translateX(calc(-202px - 12px));}

/* ── Topbar ── */
.topbar:not(.se-sales-header){background:var(--card);border-bottom:1px solid var(--border);height:var(--th);display:flex;align-items:center;padding:0 22px;gap:14px;position:sticky;top:0;z-index:30;box-shadow:var(--sh);}
.menu-btn{display:none;background:none;border:1px solid var(--border);border-radius:var(--rs);padding:6px 8px;cursor:pointer;color:var(--txt2);align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;}
.menu-btn:hover{background:var(--acc-bg);color:var(--acc);border-color:var(--acc);}
.menu-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;}
.topbar-title{font-size:15px;font-weight:700;color:var(--txt);white-space:nowrap;}
.topbar-sep{width:1px;height:20px;background:var(--border);flex-shrink:0;}
.topbar-sub{font-size:12px;color:var(--txt3);white-space:nowrap;}
.topbar-sp{flex:1;}
.topbar-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}

/* ── Content ── */
.content{padding:22px 24px 48px;flex:1;}

/* KPI cards: shared via hbe_kpi.css (icon layout + Purchase Ledger type) */

/* ── Card ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;margin-bottom:18px;}
.card:last-child{margin-bottom:0;}
.card-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border-s);gap:12px;flex-wrap:wrap;}
.card-title{font-size:13px;font-weight:700;color:var(--txt);display:flex;align-items:center;gap:7px;}
.card-title svg{width:15px;height:15px;stroke:var(--txt3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.card-body{padding:18px;}
.card-body.no-pad{padding:0;}

/* ── Form ── */
label{display:block;font-size:11px;font-weight:600;color:var(--txt2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px;}
input[type="text"],input[type="number"],textarea,select{width:100%;background:var(--entry);border:1px solid var(--border);color:var(--txt);font-family:inherit;font-size:13px;padding:9px 12px;border-radius:var(--rs);outline:none;transition:border-color .15s,box-shadow .15s;}
input:focus,textarea:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(24,119,242,.08);}
textarea{resize:vertical;min-height:60px;}
select{cursor:pointer;}
input::placeholder,textarea::placeholder{color:var(--txt3);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;}
.form-grid.three{grid-template-columns:1fr 1fr 1fr;}
.form-full{grid-column:1/-1;}
.form-sec-title{font-size:10px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border-s);}
.form-actions{display:flex;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--border-s);}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 14px;min-height:32px;border:none;border-radius:var(--rs);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;text-decoration:none;line-height:1;white-space:nowrap;}
.btn-primary{background:var(--acc);color:#fff;}
.btn-primary:hover{background:var(--acc-h);box-shadow:0 4px 12px rgba(24,119,242,.3);}
.btn-secondary{background:var(--entry);color:var(--txt2);border:1px solid var(--border);}
.btn-secondary:hover{background:#F1F5F9;color:var(--txt);}
.btn-danger{background:var(--err-bg);color:var(--err);border:1px solid rgba(220,38,38,.2);}
.btn-danger:hover{background:rgba(220,38,38,.15);}
.btn-success{background:var(--ok-bg);color:var(--ok);border:1px solid rgba(22,163,74,.2);}
.btn-success:hover{background:rgba(22,163,74,.15);}
.btn-warn{background:var(--warn-bg);color:var(--warn);border:1px solid rgba(217,119,6,.2);}
.btn-warn:hover{background:rgba(217,119,6,.15);}
.btn-purple{background:var(--pur-bg);color:var(--pur);border:1px solid rgba(124,58,237,.2);}
.btn-purple:hover{background:rgba(124,58,237,.15);}
.btn-sm{padding:4px 9px;min-height:26px;font-size:11px;}
.btn:disabled{opacity:.55;cursor:not-allowed;box-shadow:none;}

/* ── Google AI Mode style hover border glow ── */
.nav-item,.sb-pin-btn,.menu-btn,.btn,.ftab,.mnav-btn,.cal-day,.att-opt,.sd-trigger,.file-input-wrap,.btn-clear,.report-month-chip,.report-type-card,.rtc-dl,.act-btn{
  position:relative;
  isolation:isolate;
}
.nav-item::after,.sb-pin-btn::after,.menu-btn::after,.btn::after,.ftab::after,.mnav-btn::after,.cal-day::after,.att-opt::after,.sd-trigger::after,.file-input-wrap::after,.btn-clear::after,.report-month-chip::after,.report-type-card::after,.rtc-dl::after{
  content:'';
  position:absolute;
  inset:-1.4px;
  border-radius:inherit;
  padding:var(--aim-ring);
  background:conic-gradient(from var(--aim-angle),
    transparent 0deg 202deg,
    rgba(66,133,244,0) 214deg,
    rgba(66,133,244,.9) 228deg,
    var(--aim-blue) 242deg,
    var(--aim-green) 262deg,
    var(--aim-yellow) 286deg,
    var(--aim-red) 310deg,
    rgba(66,133,244,.82) 332deg,
    transparent 350deg 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude;
  filter:blur(var(--aim-blur)) saturate(1.18);
  opacity:0;
  pointer-events:none;
  transition:opacity .18s ease;
}
.act-btn::before{
  content:'';
  position:absolute;
  inset:-1.25px;
  border-radius:inherit;
  padding:1.8px;
  background:conic-gradient(from var(--aim-angle),
    transparent 0deg 202deg,
    rgba(66,133,244,0) 214deg,
    rgba(66,133,244,.9) 228deg,
    var(--aim-blue) 242deg,
    var(--aim-green) 262deg,
    var(--aim-yellow) 286deg,
    var(--aim-red) 310deg,
    rgba(66,133,244,.82) 332deg,
    transparent 350deg 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude;
  filter:blur(4px) saturate(1.18);
  opacity:0;
  pointer-events:none;
  transition:opacity .18s ease;
}
.nav-item:hover::after,.nav-item:focus-visible::after,.sb-pin-btn:hover::after,.sb-pin-btn:focus-visible::after,.menu-btn:hover::after,.menu-btn:focus-visible::after,.btn:hover::after,.btn:focus-visible::after,.ftab:hover::after,.ftab:focus-visible::after,.mnav-btn:hover::after,.mnav-btn:focus-visible::after,.cal-day:hover::after,.cal-day:focus-visible::after,.att-opt:hover::after,.att-opt:focus-visible::after,.sd-trigger:hover::after,.sd-trigger:focus-visible::after,.sd-trigger.open::after,.file-input-wrap:hover::after,.file-input-wrap:focus-within::after,.btn-clear:hover::after,.btn-clear:focus-visible::after,.report-month-chip:hover::after,.report-type-card:hover::after,.report-type-card:focus-within::after,.rtc-dl:hover::after,.rtc-dl:focus-visible::after,.act-btn:hover::before,.act-btn:focus-visible::before{
  opacity:1;
  animation:ai-hover-border-sweep 1.55s linear infinite;
}
.btn:disabled::after,.btn[disabled]::after,.cal-day.empty::after,.cal-day.future::after{
  display:none;
}

@media (prefers-reduced-motion:reduce){
  .nav-item:hover::after,.nav-item:focus-visible::after,.sb-pin-btn:hover::after,.sb-pin-btn:focus-visible::after,.menu-btn:hover::after,.menu-btn:focus-visible::after,.btn:hover::after,.btn:focus-visible::after,.ftab:hover::after,.ftab:focus-visible::after,.mnav-btn:hover::after,.mnav-btn:focus-visible::after,.cal-day:hover::after,.cal-day:focus-visible::after,.att-opt:hover::after,.att-opt:focus-visible::after,.sd-trigger:hover::after,.sd-trigger:focus-visible::after,.sd-trigger.open::after,.file-input-wrap:hover::after,.file-input-wrap:focus-within::after,.btn-clear:hover::after,.btn-clear:focus-visible::after,.report-month-chip:hover::after,.report-type-card:hover::after,.report-type-card:focus-within::after,.rtc-dl:hover::after,.rtc-dl:focus-visible::after,.act-btn:hover::before,.act-btn:focus-visible::before{
    animation:none;
  }
}

/* ── Search ── */
.search-wrap{position:relative;flex:1;min-width:160px;max-width:300px;}
.search-wrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:13px;height:13px;stroke:var(--txt3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.search-wrap input{padding-left:30px;height:32px;font-size:12px;}

/* ── Filter tabs ── */
.filter-tabs{display:flex;gap:4px;}
.ftab{padding:4px 11px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;text-decoration:none;border:1px solid var(--border);color:var(--txt2);background:var(--card);transition:all .15s;}
.ftab:hover{border-color:var(--acc);color:var(--acc);}
.ftab.ft-all{background:var(--acc);color:#fff;border-color:var(--acc);}
.ftab.ft-active{background:var(--ok-bg);color:var(--ok);border-color:rgba(22,163,74,.3);}
.ftab.ft-inactive{background:var(--err-bg);color:var(--err);border-color:rgba(220,38,38,.3);}

/* ── Table ── */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;}
thead th{background:#F8FAFD;color:var(--txt3);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;}
tbody td{padding:9px 14px;border-bottom:1px solid var(--border-s);color:var(--txt);vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:rgba(24,119,242,.025);}
tfoot td{padding:9px 14px;background:#F8FAFD;border-top:1px solid var(--border);}
.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;}
.num.blue{color:#3B82F6;}.num.orange{color:var(--warn);}.num.purple{color:var(--pur);}.num.green{color:var(--ok);}.num.red{color:var(--err);}
thead th.num{text-align:right;font-variant-numeric:tabular-nums;}
tbody td.center{text-align:center;}
thead th.center{text-align:center;}
.emp-id-cell{color:var(--txt3);font-size:11px;font-weight:600;}
.emp-name{font-weight:600;color:var(--txt);}
.emp-co{font-size:10px;font-weight:700;background:var(--acc-bg);color:var(--acc);padding:2px 6px;border-radius:4px;display:inline-block;}
.actions{white-space:nowrap;display:flex;gap:4px;}
.empty-state{text-align:center;padding:48px 24px;color:var(--txt3);}
.empty-state p{font-size:13px;margin-top:6px;}

/* ── Badge ── */
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.3px;line-height:1.5;}
.bg-green{background:var(--ok-bg);color:var(--ok);}
.bg-red{background:var(--err-bg);color:var(--err);}
.bg-orange{background:var(--warn-bg);color:var(--warn);}
.bg-blue{background:var(--acc-bg);color:var(--acc);}
.bg-gray{background:#F1F5F9;color:var(--txt3);}

/* ── Month nav ── */
.month-nav{display:flex;align-items:center;gap:6px;}
.mnav-btn{width:28px;height:28px;background:var(--entry);border:1px solid var(--border);border-radius:var(--rs);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--txt2);text-decoration:none;transition:all .15s;font-size:13px;}
.mnav-btn:hover{background:var(--acc-bg);border-color:var(--acc);color:var(--acc);}
.mnav-lbl{font-size:13px;font-weight:700;color:var(--txt);min-width:126px;text-align:center;}

/* ── Salary strip ── */
.sal-strip{display:grid;grid-template-columns:repeat(4,1fr);}
.sal-item{padding:14px 16px;border-right:1px solid var(--border-s);text-align:center;}
.sal-item:last-child{border-right:none;}
.sal-lbl{font-size:9px;font-weight:600;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;}
.sal-val{font-size:18px;font-weight:800;color:var(--txt);}
.sal-val.blue{color:#3B82F6;}.sal-val.orange{color:var(--warn);}.sal-val.purple{color:var(--pur);}.sal-val.green{color:var(--ok);}.sal-val.red{color:var(--err);}

/* ── Attendance strip (8 cols) ── */
.att-strip{display:grid;grid-template-columns:repeat(8,1fr);border-bottom:1px solid var(--border-s);}
.att-si{padding:11px 8px;border-right:1px solid var(--border-s);text-align:center;}
.att-si:last-child{border-right:none;}
.att-slbl{font-size:9px;font-weight:600;color:var(--txt3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;}
.att-sval{font-size:15px;font-weight:800;color:var(--txt);}

/* ── Calendar ── */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:16px;}
.cal-hdr{font-size:9px;font-weight:700;color:var(--txt3);text-transform:uppercase;text-align:center;padding:6px 0;letter-spacing:.3px;}
.cal-day{background:var(--entry);border:1px solid var(--border);border-radius:8px;padding:7px 4px;text-align:center;min-height:54px;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:3px;}
.cal-day:hover{border-color:var(--acc);background:var(--acc-bg);}
.cal-day.empty{background:transparent;border-color:transparent;cursor:default;}
.cal-day.empty:hover{background:transparent;border-color:transparent;}
.day-num{font-size:12px;font-weight:700;color:var(--txt);}
.day-st{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;padding:2px 5px;border-radius:3px;line-height:1.4;}
.cal-day.status-present{border-color:rgba(22,163,74,.35);background:rgba(22,163,74,.06);}
.cal-day.status-present .day-st{background:rgba(22,163,74,.18);color:var(--ok);}
.cal-day.status-absent{border-color:rgba(220,38,38,.35);background:rgba(220,38,38,.06);}
.cal-day.status-absent .day-st{background:rgba(220,38,38,.18);color:var(--err);}
.cal-day.status-half_day{border-color:rgba(217,119,6,.35);background:rgba(217,119,6,.06);}
.cal-day.status-half_day .day-st{background:rgba(217,119,6,.18);color:var(--warn);}
.cal-day.status-holiday{border-color:rgba(24,119,242,.3);background:rgba(24,119,242,.06);}
.cal-day.status-holiday .day-st{background:rgba(24,119,242,.18);color:var(--acc);}
.cal-day.today{box-shadow:0 0 0 2px var(--acc);}
.cal-day.future{opacity:.38;cursor:not-allowed;pointer-events:none;}
.cal-day.future:hover{border-color:var(--border);background:var(--entry);}

/* ── Att popup ── */
.att-popup{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center;}
.att-popup.active{display:flex;}
.att-popup-inner{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px 24px;width:290px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.18);}
.att-popup-inner h3{font-size:14px;font-weight:700;margin-bottom:14px;color:var(--txt);}
.att-options{display:flex;flex-direction:column;gap:6px;}
.att-opt{padding:10px 14px;border-radius:7px;border:1px solid var(--border);background:var(--entry);cursor:pointer;font-size:13px;font-weight:600;text-align:center;transition:all .15s;font-family:inherit;color:var(--txt);}
.att-opt:hover{border-color:var(--acc);}
.att-opt.present{color:var(--ok);border-color:rgba(22,163,74,.3);}
.att-opt.present:hover{background:var(--ok-bg);}
.att-opt.absent{color:var(--err);border-color:rgba(220,38,38,.3);}
.att-opt.absent:hover{background:var(--err-bg);}
.att-opt.half_day{color:var(--warn);border-color:rgba(217,119,6,.3);}
.att-opt.half_day:hover{background:var(--warn-bg);}
.att-opt.clear{color:var(--txt3);}
.att-cancel{margin-top:10px;text-align:center;}

/* ── Inline salary ── */
.inline-sal{width:86px;background:var(--entry);border:1px solid var(--border);color:var(--txt);font-family:inherit;font-size:12px;padding:5px 7px;border-radius:var(--rs);text-align:right;font-weight:600;font-variant-numeric:tabular-nums;transition:border-color .15s;}
.inline-sal:focus{border-color:var(--acc);outline:none;}
.inline-sal.saving{border-color:var(--warn);}
.inline-sal.saved{border-color:var(--ok);}
.inline-sal.error{border-color:var(--err);}

/* ── Searchable dropdown ── */
.sd-wrap{position:relative;}
.sd-trigger{width:100%;background:var(--entry);border:1px solid var(--border);color:var(--txt);font-family:inherit;font-size:13px;padding:9px 12px;border-radius:var(--rs);cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:border-color .15s;user-select:none;gap:8px;}
.sd-trigger:hover{border-color:var(--acc);}
.sd-trigger.open{border-color:var(--acc);border-radius:var(--rs) var(--rs) 0 0;}
.sd-arrow{flex-shrink:0;transition:transform .18s;color:var(--txt3);}
.sd-trigger.open .sd-arrow{transform:rotate(180deg);}
.sd-panel{position:absolute;top:100%;left:0;right:0;z-index:300;background:var(--card);border:1px solid var(--acc);border-top:none;border-radius:0 0 8px 8px;box-shadow:var(--sh2);overflow:hidden;display:none;}
.sd-search-wrap{padding:7px 7px 4px;}
.sd-search{width:100%;background:var(--entry);border:1px solid var(--border);color:var(--txt);font-family:inherit;font-size:12px;padding:7px 10px;border-radius:5px;outline:none;}
.sd-search:focus{border-color:var(--acc);}
.sd-list{max-height:190px;overflow-y:auto;padding:4px 6px 7px;}
.sd-item{padding:8px 10px;border-radius:5px;cursor:pointer;font-size:13px;color:var(--txt);transition:background .1s;}
.sd-item:hover{background:var(--acc-bg);color:var(--acc);}
.sd-item.active{background:var(--acc-bg);color:var(--acc);}
.sd-item.selected{font-weight:700;color:var(--acc);}
.sd-empty{padding:9px 12px;font-size:12px;color:var(--txt3);text-align:center;}

/* ── Import modal ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:400;align-items:center;justify-content:center;}
.modal-overlay.active{display:flex;}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px 26px;width:440px;max-width:92vw;box-shadow:0 20px 60px rgba(0,0,0,.18);}
.modal-box h3{font-size:15px;font-weight:700;color:var(--txt);margin-bottom:6px;}
.modal-box p{font-size:12px;color:var(--txt3);margin-bottom:16px;line-height:1.6;}
.modal-box .modal-cols{font-size:11px;background:#F8FAFD;border:1px solid var(--border-s);border-radius:var(--rs);padding:10px 14px;margin-bottom:16px;color:var(--txt2);font-family:monospace;}
.modal-actions{display:flex;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--border-s);}
.file-input-wrap{border:2px dashed var(--border);border-radius:var(--rs);padding:18px;text-align:center;cursor:pointer;transition:border-color .15s;}
.file-input-wrap:hover{border-color:var(--acc);}
.file-input-wrap input[type="file"]{display:none;}
.file-input-wrap .fi-label{font-size:13px;color:var(--txt2);font-weight:500;}
.file-input-wrap .fi-hint{font-size:11px;color:var(--txt3);margin-top:4px;}
