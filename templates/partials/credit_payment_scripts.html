<script>
(function(){

  if (typeof window.hbeBestSearchScore !== 'function') {
    window.hbeNorm = function(s){ return String(s || '').toLowerCase().trim(); };
    window.hbeSearchScore = function(text, query){
      var hay = window.hbeNorm(text);
      var q = window.hbeNorm(query);
      if (!q) return 0;
      if (!hay) return -1;
      if (hay === q) return 400;
      if (hay.indexOf(q) === 0) return 300;
      var tokens = hay.split(/[\s\/\-_.,;:()]+/).filter(Boolean);
      var i, t;
      for (i = 0; i < tokens.length; i++) {
        t = tokens[i];
        if (t === q) return 250;
        if (t.indexOf(q) === 0) return 200;
      }
      if (hay.indexOf(q) !== -1) return 100;
      return -1;
    };
    window.hbeSearchScoreQuery = function(text, query){
      var terms = window.hbeNorm(query).split(/\s+/).filter(Boolean);
      if (!terms.length) return 0;
      var score = 0, s, i;
      for (i = 0; i < terms.length; i++) {
        s = window.hbeSearchScore(text, terms[i]);
        if (s < 0) return -1;
        score += s;
      }
      return score;
    };
    window.hbeBestSearchScore = function(fields, query){
      var best = -1, i, s;
      fields = fields || [];
      for (i = 0; i < fields.length; i++) {
        s = window.hbeSearchScoreQuery(fields[i], query);
        if (s > best) best = s;
      }
      return best;
    };
  }

  var page = document.getElementById('credit-payment-page');
  if (!page) return;

  var createUrl = page.getAttribute('data-create-url') || '';
  var deleteUrl = page.getAttribute('data-delete-url') || '';
  var detailUrlTemplate = page.getAttribute('data-detail-url-template') || '';
  var todayIso = page.getAttribute('data-today') || '';
  var canMutate = page.getAttribute('data-can-mutate') === '1';
  var methodLabels = {{ credit_payment_method_labels|tojson }};
  var categoryLabels = {{ expense_category_labels|tojson }};
  var labels = {{ settlement_labels|tojson }};
  var showPaymentMode = labels.show_payment_mode !== false;
  var showVerificationAccount = labels.show_verification_account === true;
  var autoClearanceDate = labels.auto_clearance_date === true
    || page.getAttribute('data-auto-clearance-date') === '1';
  var txnMethods = Array.isArray(labels.requires_txn_methods) && labels.requires_txn_methods.length
    ? labels.requires_txn_methods
    : ['card'];
  var partyPlural = labels.party_plural || 'suppliers';
  var requirePaymentMethod = labels.require_payment_method_choice === true;

  function methodRequiresTxn(method){
    return txnMethods.indexOf(String(method || '')) !== -1;
  }

  var outstandingData = [];
  try {
    var dataEl = document.getElementById('cp-outstanding-data');
    outstandingData = dataEl ? JSON.parse(dataEl.textContent || '[]') : [];
  } catch (e) {
    outstandingData = [];
  }

  var pendingSelections = [];
  function reportDt(value) {
    if (typeof window.formatReportDatetime === 'function') {
      return window.formatReportDatetime(value);
    }
    return value == null || value === '' ? '—' : String(value);
  }
  var selectionSource = 'table'; // 'table' | 'modal'

  function formatInr(amount, dec){
    var places = dec === undefined ? 0 : dec;
    if (typeof window.formatInr === 'function') return window.formatInr(amount, places);
    var n = Number(amount || 0);
    if (!isFinite(n)) return '₹0';
    return (n < 0 ? '−' : '') + '₹' + Math.abs(n).toLocaleString('en-IN', {
      maximumFractionDigits: places,
      minimumFractionDigits: 0
    });
  }

  function isKpiAmountNode(el){
    return !!(el && (
      el.classList.contains('pl-summary-value') ||
      el.classList.contains('kpi-val') ||
      el.classList.contains('hbe-kpi-value') ||
      el.classList.contains('sr-kpi-value') ||
      el.classList.contains('tips-payout-metric-value')
    ));
  }

  function formatMoneyNodes(root){
    (root || document).querySelectorAll('[data-amount]').forEach(function(el){
      var raw = el.getAttribute('data-amount');
      // Empty data-amount keeps placeholder text (e.g. tender "—"), not ₹0.
      if (raw === null || String(raw).trim() === '') return;
      el.textContent = formatInr(raw, isKpiAmountNode(el) ? 0 : 0);
    });
  }

  formatMoneyNodes(document);
  if (typeof scheduleFitKpiValues === 'function') scheduleFitKpiValues();

  function openModal(el){
    if (!el) return;
    el.classList.add('open');
    el.setAttribute('aria-hidden', 'false');
    if (el.id === 'cp-clearance-modal' && typeof window.initHotelDatePickers === 'function') {
      window.initHotelDatePickers(el);
    }
  }

  function closeModal(el){
    if (!el) return;
    el.classList.remove('open');
    el.setAttribute('aria-hidden', 'true');
  }

  function setError(el, msg){
    if (!el) return;
    if (msg) {
      el.textContent = msg;
      el.style.display = 'block';
      el.hidden = false;
      el.removeAttribute('hidden');
    } else {
      el.textContent = '';
      el.style.display = 'none';
      el.hidden = true;
    }
  }

  function escapeHtml(value){
    return String(value || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function selectionFromRow(row, amount){
    var balance = Number(row.getAttribute('data-balance') || 0);
    var payAmount = amount == null ? balance : Number(amount);
    return {
      expense_id: Number(row.getAttribute('data-expense-id')),
      amount: payAmount,
      balance: balance,
      expense_code: row.getAttribute('data-expense-code') || '',
      description: row.getAttribute('data-description') || '',
      supplier_id: Number(row.getAttribute('data-supplier-id') || 0),
      supplier_name: row.getAttribute('data-supplier-name') || '',
      category: row.getAttribute('data-category') || ''
    };
  }

  /* ---------- Filters (credit payment supplier combobox; soft-nav safe) ---------- */
  function cpComboboxInput(root){
    if (!root) return null;
    return root.querySelector('input.se-filter-chip-combobox, input.se-filter-chip-trigger[type="search"]');
  }

  function isCpCombobox(root){
    return !!(root && root.hasAttribute('data-se-listbox-combobox'));
  }

  function clearCpFixedListbox(list){
    if (!list) return;
    list.style.position = '';
    list.style.left = '';
    list.style.right = '';
    list.style.top = '';
    list.style.bottom = '';
    list.style.width = '';
    list.style.minWidth = '';
    list.style.maxHeight = '';
    list.style.zIndex = '';
    list.style.paddingBottom = '';
    list.scrollTop = 0;
  }

  function positionCpFixedListbox(root, list){
    if (!root || !list) return;
    var control = root.querySelector('.se-filter-chip-control') || root;
    var rect = control.getBoundingClientRect();
    var width = Math.max(rect.width, 140);
    var left = Math.min(rect.left, Math.max(8, window.innerWidth - width - 8));
    var spaceBelow = window.innerHeight - rect.bottom - 12;
    var spaceAbove = rect.top - 12;
    var openUp = spaceBelow < 180 && spaceAbove > spaceBelow;
    var maxHeight = Math.min(260, Math.max(120, openUp ? spaceAbove : spaceBelow));
    list.style.position = 'fixed';
    list.style.left = left + 'px';
    list.style.right = 'auto';
    list.style.width = width + 'px';
    list.style.minWidth = width + 'px';
    list.style.maxHeight = maxHeight + 'px';
    list.style.zIndex = '10090';
    if (openUp) {
      list.style.top = 'auto';
      list.style.bottom = (window.innerHeight - rect.top + 6) + 'px';
    } else {
      list.style.bottom = 'auto';
      list.style.top = (rect.bottom + 6) + 'px';
    }
  }

  function closeCpDatePicker(){
    if (window.SalesDateRangePicker && typeof window.SalesDateRangePicker.closeIfOpen === 'function') {
      window.SalesDateRangePicker.closeIfOpen('cp-date-range-wrap');
    }
  }

  function restoreCpComboboxLabel(root){
    var combo = cpComboboxInput(root);
    if (!combo) return;
    var selected = root.querySelector('.se-filter-listbox-option.is-selected');
    var hidden = root.querySelector('input[type="hidden"]');
    var value = hidden ? String(hidden.value || '').trim() : '';
    var label = selected
      ? (selected.getAttribute('data-label') || selected.textContent || '').trim()
      : '';
    if (!value || value === 'all') {
      combo.value = '';
      combo.classList.add('is-placeholder');
      return;
    }
    combo.value = label || value;
    combo.classList.remove('is-placeholder');
  }

  function closeCpListbox(root){
    if (!root) return;
    var trigger = root.querySelector('.se-filter-chip-trigger');
    var list = root.querySelector('.se-filter-listbox');
    var search = root.querySelector('.pl-supplier-search');
    var combo = isCpCombobox(root) ? cpComboboxInput(root) : null;
    var wasOpen = root.classList.contains('is-open');
    root.classList.remove('is-open');
    if (trigger) trigger.setAttribute('aria-expanded', 'false');
    if (list) {
      list.hidden = true;
      clearCpFixedListbox(list);
    }
    if (search) search.value = '';
    if (root.hasAttribute('data-se-listbox-searchable')) filterCpSearchableOptions(root, '');
    if (wasOpen && combo) restoreCpComboboxLabel(root);
  }

  function closeAllCpListboxes(except){
    document.querySelectorAll('#credit-payment-filter-form [data-se-listbox].is-open').forEach(function(root){
      if (root !== except) closeCpListbox(root);
    });
  }

  function scoreCpSearchOption(option, needle){
    if (!needle) return 0;
    if (typeof window.hbeBestSearchScore === 'function') {
      return window.hbeBestSearchScore([
        option.getAttribute('data-name') || '',
        option.getAttribute('data-gst') || '',
        option.getAttribute('data-label') || option.textContent || ''
      ], needle);
    }
    var name = (option.getAttribute('data-name') || '').toLowerCase();
    var gst = (option.getAttribute('data-gst') || '').toLowerCase();
    var terms = String(needle || '').toLowerCase().split(/\s+/).filter(Boolean);
    var score = 0;
    for (var i = 0; i < terms.length; i++) {
      var term = terms[i];
      if (name === term || (gst && gst === term)) score += 400;
      else if (name.indexOf(term) === 0 || (gst && gst.indexOf(term) === 0)) score += 300;
      else {
        var tokens = name.split(/[\s\/_\-.,;:()]+/).filter(Boolean);
        var word = false;
        for (var t = 0; t < tokens.length; t++) {
          if (tokens[t].indexOf(term) === 0) { word = true; break; }
        }
        if (word) score += 200;
        else if (name.indexOf(term) !== -1 || (gst && gst.indexOf(term) !== -1)) score += 100;
        else return -1;
      }
    }
    return score;
  }

  function filterCpSearchableOptions(root, query){
    var optionsWrap = root.querySelector('.pl-supplier-options');
    var emptyEl = root.querySelector('.pl-supplier-empty');
    if (!optionsWrap) return;
    var needle = String(query || '').trim().toLowerCase();
    var options = Array.from(optionsWrap.querySelectorAll('.pl-supplier-option'));
    if (!needle) {
      options.sort(function(a, b){
        var aAll = (a.getAttribute('data-value') || '') === 'all';
        var bAll = (b.getAttribute('data-value') || '') === 'all';
        if (aAll && !bAll) return -1;
        if (bAll && !aAll) return 1;
        var aLabel = (a.getAttribute('data-label') || a.getAttribute('data-name') || a.textContent || '').trim();
        var bLabel = (b.getAttribute('data-label') || b.getAttribute('data-name') || b.textContent || '').trim();
        return aLabel.localeCompare(bLabel, undefined, { sensitivity: 'base', numeric: true });
      });
      options.forEach(function(option){
        option.classList.remove('is-filtered-out');
        optionsWrap.appendChild(option);
      });
      if (emptyEl) emptyEl.hidden = true;
      return;
    }
    var ranked = options.map(function(option){
      return { option: option, score: scoreCpSearchOption(option, needle) };
    }).filter(function(entry){
      return entry.score >= 0;
    });
    ranked.sort(function(a, b){
      return b.score - a.score
        || (a.option.getAttribute('data-label') || a.option.getAttribute('data-name') || '').localeCompare(
          b.option.getAttribute('data-label') || b.option.getAttribute('data-name') || '',
          undefined,
          { sensitivity: 'base', numeric: true }
        );
    });
    options.forEach(function(option){ option.classList.add('is-filtered-out'); });
    ranked.forEach(function(entry){ entry.option.classList.remove('is-filtered-out'); });
    if (emptyEl) emptyEl.hidden = ranked.length > 0;
  }

  function visibleCpOptions(root){
    var optionsWrap = root.querySelector('.pl-supplier-options');
    if (!optionsWrap) return [];
    return Array.from(optionsWrap.querySelectorAll('.pl-supplier-option:not(.is-filtered-out)'));
  }

  function scrollCpSelectedToTop(list){
    if (!list) return;
    var selected = list.querySelector('.se-filter-listbox-option.is-selected, .se-filter-listbox-option[aria-selected="true"], .pl-supplier-option.is-selected');
    if (!selected || selected.classList.contains('is-filtered-out')) return;
    list.style.paddingBottom = '';
    requestAnimationFrame(function(){
      var searchWrap = list.querySelector('.pl-supplier-search-wrap, .ep-listbox-search-wrap');
      var topPad = searchWrap ? searchWrap.offsetHeight : 0;
      if (list.scrollHeight <= list.clientHeight + 1) {
        list.scrollTop = 0;
        return;
      }
      var target = Math.max(0, selected.offsetTop - topPad);
      var naturalMax = Math.max(0, list.scrollHeight - list.clientHeight);
      if (target > naturalMax) {
        list.style.paddingBottom = (target - naturalMax) + 'px';
      }
      list.scrollTop = target;
    });
  }

  function openCpListbox(root, opts){
    if (!root || root.classList.contains('is-disabled')) return;
    opts = opts || {};
    closeCpDatePicker();
    closeAllCpListboxes(root);
    var trigger = root.querySelector('.se-filter-chip-trigger');
    var list = root.querySelector('.se-filter-listbox');
    var search = root.querySelector('.pl-supplier-search');
    var combo = isCpCombobox(root) ? cpComboboxInput(root) : null;
    root.classList.add('is-open');
    if (trigger) trigger.setAttribute('aria-expanded', 'true');
    if (list) {
      list.hidden = false;
      positionCpFixedListbox(root, list);
      if (root.hasAttribute('data-se-listbox-searchable')) {
        var query = combo && opts.keepQuery ? combo.value : '';
        filterCpSearchableOptions(root, query);
        if (!combo || !opts.keepQuery) scrollCpSelectedToTop(list);
        if (combo) {
          if (opts.selectAll) {
            try { combo.select(); } catch (e) {}
          }
        } else if (search) {
          search.value = '';
          search.focus();
        }
      } else {
        scrollCpSelectedToTop(list);
      }
    }
  }

  function toggleCpListbox(root){
    if (!root) return;
    if (root.classList.contains('is-open')) closeCpListbox(root);
    else openCpListbox(root);
  }

  function selectCpOption(root, option){
    if (!root || !option || option.classList.contains('is-filtered-out')) return;
    var form = document.getElementById('credit-payment-filter-form');
    var input = root.querySelector('input[type="hidden"]');
    var valueEl = root.querySelector('.se-filter-chip-value');
    var combo = cpComboboxInput(root);
    var list = root.querySelector('.se-filter-listbox');
    var value = option.getAttribute('data-value') || 'all';
    var nameEl = option.querySelector('.pl-supplier-option-name');
    var label = option.getAttribute('data-label')
      || (nameEl ? nameEl.textContent.trim() : (option.textContent || '').trim());
    if (input) input.value = value;
    if (combo) {
      combo.value = value === 'all' ? '' : label;
      combo.classList.toggle('is-placeholder', value === 'all' || !value);
    }
    if (valueEl) valueEl.textContent = label;
    if (list) {
      list.querySelectorAll('.pl-supplier-option, .se-filter-listbox-option').forEach(function(opt){
        var on = opt === option;
        opt.classList.toggle('is-selected', on);
        opt.setAttribute('aria-selected', on ? 'true' : 'false');
      });
    }
    closeCpListbox(root);
    if (!form) return;
    if (typeof window.deSoftSubmitForm === 'function' && window.deSoftSubmitForm(form)) return;
    form.submit();
  }

  function bindCpListbox(root){
    if (!root || root.__cpFilterListboxBound) return;
    root.__cpFilterListboxBound = true;
    // Prevent ep_form_listbox.js from double-binding after soft-nav.
    root.__epListboxBound = true;
    root.__suFilterListboxBound = true;
    root.__plFilterListboxBound = true;
    var trigger = root.querySelector('.se-filter-chip-trigger');
    var control = root.querySelector('.se-filter-chip-control');
    var list = root.querySelector('.se-filter-listbox');
    var optionsWrap = root.querySelector('.pl-supplier-options');
    var search = root.querySelector('.pl-supplier-search');
    var combo = isCpCombobox(root) ? cpComboboxInput(root) : null;
    if (!trigger || !list) return;

    if (combo) {
      combo.addEventListener('mousedown', function(e){
        e.stopPropagation();
        if (!root.classList.contains('is-open')) openCpListbox(root, { selectAll: true });
      });
      combo.addEventListener('focus', function(){
        if (!root.classList.contains('is-open')) openCpListbox(root, { selectAll: true });
      });
      combo.addEventListener('click', function(e){ e.stopPropagation(); });
      combo.addEventListener('input', function(){
        if (!root.classList.contains('is-open')) {
          openCpListbox(root, { keepQuery: true });
        } else {
          filterCpSearchableOptions(root, combo.value);
          positionCpFixedListbox(root, list);
        }
      });
      combo.addEventListener('keydown', function(e){
        var options = visibleCpOptions(root);
        if (e.key === 'Escape') {
          e.preventDefault();
          closeCpListbox(root);
          return;
        }
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (!root.classList.contains('is-open')) {
            openCpListbox(root, { keepQuery: true });
            options = visibleCpOptions(root);
          }
          if (options[0]) options[0].focus();
          return;
        }
        if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (root.classList.contains('is-open') && options.length) {
            options[options.length - 1].focus();
          }
          return;
        }
        if (e.key === 'Enter') {
          e.preventDefault();
          if (!root.classList.contains('is-open')) {
            openCpListbox(root, { keepQuery: true });
            return;
          }
          var firstMatch = visibleCpOptions(root)[0];
          if (firstMatch) selectCpOption(root, firstMatch);
        }
      });
      list.addEventListener('mousedown', function(e){
        if (e.target.closest('.se-filter-listbox-option, .pl-supplier-option')) e.preventDefault();
      });
      if (control) {
        control.addEventListener('click', function(e){
          if (e.target.closest('.se-filter-chip-trigger')) return;
          if (e.target.closest('.se-filter-listbox')) return;
          e.preventDefault();
          e.stopPropagation();
          combo.focus();
          if (!root.classList.contains('is-open')) openCpListbox(root, { selectAll: true });
        });
      }
    } else {
      function onTriggerClick(e){
        e.preventDefault();
        e.stopPropagation();
        toggleCpListbox(root);
      }

      trigger.addEventListener('click', onTriggerClick);
      if (control) {
        control.addEventListener('click', function(e){
          if (e.target.closest('.se-filter-chip-trigger')) return;
          if (e.target.closest('.se-filter-listbox')) return;
          onTriggerClick(e);
        });
      }
      trigger.addEventListener('keydown', function(e){
        if (e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openCpListbox(root);
        } else if (e.key === 'Escape') {
          closeCpListbox(root);
        }
      });
    }

    if (search) {
      search.addEventListener('input', function(){
        filterCpSearchableOptions(root, search.value);
      });
      search.addEventListener('click', function(e){ e.stopPropagation(); });
      search.addEventListener('keydown', function(e){
        e.stopPropagation();
        if (e.key === 'Escape') {
          e.preventDefault();
          closeCpListbox(root);
          trigger.focus();
        } else if (e.key === 'Enter') {
          e.preventDefault();
          var firstMatch = visibleCpOptions(root)[0];
          if (firstMatch) selectCpOption(root, firstMatch);
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          var first = visibleCpOptions(root)[0];
          if (first) first.focus();
        }
      });
    }

    var clickTarget = optionsWrap || list;
    clickTarget.addEventListener('click', function(e){
      var option = e.target.closest('.pl-supplier-option, .se-filter-listbox-option');
      if (!option || !clickTarget.contains(option) || option.classList.contains('is-filtered-out')) return;
      e.preventDefault();
      selectCpOption(root, option);
    });

    clickTarget.addEventListener('keydown', function(e){
      var options = root.hasAttribute('data-se-listbox-searchable')
        ? visibleCpOptions(root)
        : Array.from(list.querySelectorAll('.se-filter-listbox-option'));
      if (!options.length) return;
      var idx = options.indexOf(document.activeElement);
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        options[Math.min(options.length - 1, Math.max(0, idx) + 1)].focus();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (idx <= 0 && combo) {
          combo.focus();
          return;
        }
        options[Math.max(0, (idx < 0 ? 0 : idx) - 1)].focus();
      } else if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        if (idx >= 0) selectCpOption(root, options[idx]);
      } else if (e.key === 'Escape') {
        e.preventDefault();
        closeCpListbox(root);
        trigger.focus();
      }
    });
  }

  function bindCpDocumentGuards(){
    if (window.__cpFilterDocBound) return;
    window.__cpFilterDocBound = true;
    function repositionOpenCpListboxes(){
      document.querySelectorAll('#credit-payment-filter-form [data-se-listbox].is-open').forEach(function(root){
        var list = root.querySelector('.se-filter-listbox');
        if (list) positionCpFixedListbox(root, list);
      });
    }
    document.addEventListener('click', function(e){
      document.querySelectorAll('#credit-payment-filter-form [data-se-listbox].is-open').forEach(function(root){
        if (!root.contains(e.target)) closeCpListbox(root);
      });
    });
    document.addEventListener('keydown', function(e){
      if (e.key !== 'Escape') return;
      document.querySelectorAll('#credit-payment-filter-form [data-se-listbox].is-open').forEach(closeCpListbox);
    });
    window.addEventListener('resize', repositionOpenCpListboxes);
    document.addEventListener('scroll', repositionOpenCpListboxes, true);
  }

  function sortCreditPaymentSupplierOptions(){
    var wrap = document.getElementById('credit-payment-supplier-options');
    if (!wrap || wrap.getAttribute('data-cp-sorted') === '1') return;
    wrap.setAttribute('data-cp-sorted', '1');
    var options = Array.from(wrap.querySelectorAll('.se-filter-listbox-option'));
    options.sort(function(a, b){
      var aAll = (a.getAttribute('data-value') || '') === 'all';
      var bAll = (b.getAttribute('data-value') || '') === 'all';
      if (aAll && !bAll) return -1;
      if (bAll && !aAll) return 1;
      var aLabel = (a.getAttribute('data-label') || a.textContent || '').trim();
      var bLabel = (b.getAttribute('data-label') || b.textContent || '').trim();
      return aLabel.localeCompare(bLabel, undefined, { sensitivity: 'base', numeric: true });
    });
    options.forEach(function(opt){ wrap.appendChild(opt); });
  }

  function bindKindFilterTabs(form){
    var tabs = document.getElementById('credit-payment-kind-tabs');
    var hidden = document.getElementById('credit-payment-kind');
    if (!tabs || !hidden || tabs.getAttribute('data-cp-kind-filter-bound') === '1') return;

  function applyCreditPaymentSearch(){
    var needle = searchInput ? String(searchInput.value || '').trim() : '';
    if (searchChip) searchChip.classList.toggle('is-active', !!needle);
    var rows = Array.from(document.querySelectorAll('#cp-outstanding-table tbody tr.cp-expense-row, #cp-history-table tbody tr.cp-history-row'));
    var visible = 0;
    function scoreRow(row){
      return window.hbeBestSearchScore([row.getAttribute('data-search') || row.textContent || ''], needle);
    }
    if (!needle) {
      rows.forEach(function(row){ row.hidden = false; visible += 1; });
    } else {
      var ranked = rows.map(function(row){ return { row: row, score: scoreRow(row) }; });
      ranked.sort(function(a, b){ return b.score - a.score; });
      ranked.forEach(function(entry){
        var match = entry.score >= 0;
        entry.row.hidden = !match;
        if (!match) {
          var check = entry.row.querySelector('.cp-row-check');
          if (check) check.checked = false;
          entry.row.classList.remove('is-selected');
        } else {
          visible += 1;
          if (entry.row.parentNode) entry.row.parentNode.appendChild(entry.row);
        }
      });
    }
    if (entryCountEl) entryCountEl.textContent = visible + ' entries';
    if (typeof updateTableSelectionUi === 'function') updateTableSelectionUi();
  }

      if (!key || seen[key]) return;

      if (name) names.push(name);

    if (names.length === 1) return '· ' + names[0];

  function renderBorReceiptRows(receipts){
    if (!borList) return;
    borList.innerHTML = '';
    pendingReceipts = receipts || [];
    var borTotalRow = document.getElementById('cp-bor-total-row');
    if (!pendingReceipts.length) {
      if (borEmpty) borEmpty.hidden = false;
      if (borTotalRow) borTotalRow.hidden = true;
      refreshSplitBalance();
      return;
    }
    if (borEmpty) borEmpty.hidden = true;
    if (borTotalRow) borTotalRow.hidden = false;
    var remainingPay = paymentTotalNow();
    pendingReceipts.forEach(function(receipt, index){
      var pendingAmt = Math.round((Number(receipt.pending_amount) || 0) * 100) / 100;
      var defaultApply = 0;
      if (remainingPay > 0.009 && pendingAmt > 0.009) {
        defaultApply = Math.min(pendingAmt, remainingPay);
        remainingPay = Math.round((remainingPay - defaultApply) * 100) / 100;
      }
      var checked = defaultApply > 0.009 || (index === 0 && pendingAmt > 0.009);
      if (checked && defaultApply <= 0.009) {
        defaultApply = Math.min(pendingAmt, paymentTotalNow() || pendingAmt);
      }
      var row = document.createElement('div');
      row.className = 'cp-bor-row';
      row.setAttribute('data-receipt-id', receipt.id);
      row.setAttribute('data-pending', String(pendingAmt));
      row.setAttribute('role', 'listitem');

          pendingAmt + '" value="' + defaultApply +
          '" aria-label="Apply amount for ' + escapeHtml(receipt.receipt_no || 'receipt') + '"' +
          (checked ? '' : ' disabled') + '>';

          amountInput.value = String(Math.min(pendingAmt, paymentTotalNow() || pendingAmt));
        }
        refreshSplitBalance();
      }
      if (check) check.addEventListener('change', syncEnabled);
      if (amountInput) amountInput.addEventListener('input', refreshSplitBalance);
    });
    refreshSplitBalance();

  async function loadPendingReceipts(){
    if (!enableBor || !borWrap || !pendingReceiptsUrl) {
      if (borWrap) borWrap.hidden = true;
      return;
    }
    var method = currentMethodValue();
    var show = !splitMode && method === 'bor';
    borWrap.hidden = !show;
    if (!show) return;
    var ctx = selectedAgencyContext();
    var qs = [];
    if (ctx.agency_id) qs.push('agency_id=' + encodeURIComponent(ctx.agency_id));
    if (ctx.agency_name) qs.push('agency_name=' + encodeURIComponent(ctx.agency_name));
    try {
      var res = await fetch(pendingReceiptsUrl + (qs.length ? ('?' + qs.join('&')) : ''));
      var data = await res.json();
      if (!data.ok) throw new Error(data.error || 'Unable to load receipts.');
      renderBorReceiptRows(data.receipts || []);
    } catch (err) {
      renderBorReceiptRows([]);
      if (borEmpty) {
        borEmpty.hidden = false;
        borEmpty.textContent = (err && err.message) || 'Unable to load receipts.';
      }
    }
  }

      var amount = Number((row.querySelector('.cp-bor-amount') || {}).value || 0);
      var receiptId = Number(row.getAttribute('data-receipt-id'));
      var pending = Number(row.getAttribute('data-pending') || 0);
      if (!receiptId || !amount || amount <= 0 || amount > pending + 0.001) return;
      rows.push({ receipt_id: receiptId, amount: amount, method: 'bor' });
    });
    return rows;
  }

  function splitRows(){

  function roundSplitMoney(value){
    return Math.round(Number(value || 0) * 100) / 100;
  }

  /** Keep split amounts totaling the pay-now target (same behavior as POS settle). */
  function syncRemainingSplitAmount(changedRow){
    var rows = splitRows();
    if (rows.length < 2) return;
    var target = paymentTotalNow();
    if (!(target > 0)) return;

    function amountRaw(row){
      var input = row.querySelector('.cp-split-amount');
      return input ? String(input.value || '').trim() : '';
    }
    function setAmount(row, value){
      var input = row.querySelector('.cp-split-amount');
      if (!input) return;
      input.value = value > 0 ? String(value) : '';
    }

    if (rows.length === 2) {
      var first = rows[0];
      var second = rows[1];
      if (!changedRow) {
        var firstRaw = amountRaw(first);
        var secondRaw = amountRaw(second);
        var firstAmt = Number(firstRaw);
        var secondAmt = Number(secondRaw);
        if (firstRaw && isFinite(firstAmt) && firstAmt > 0 && !secondRaw) {
          setAmount(second, roundSplitMoney(target - firstAmt));
        } else if (secondRaw && isFinite(secondAmt) && secondAmt > 0 && !firstRaw) {
          setAmount(first, roundSplitMoney(target - secondAmt));
        }
        return;
      }
      var otherRow = changedRow === first ? second : first;
      var raw = amountRaw(changedRow);
      var amount = Number(raw);
      if (!raw || !isFinite(amount) || amount <= 0) {
        setAmount(otherRow, 0);
        return;
      }
      setAmount(otherRow, roundSplitMoney(target - amount));
      return;
    }

    var lastRow = rows[rows.length - 1];
    if (changedRow && changedRow === lastRow) return;
    var others = 0;
    var hasEarlierAmount = false;
    for (var i = 0; i < rows.length - 1; i++) {
      var rawEarlier = amountRaw(rows[i]);
      var amountEarlier = Number(rawEarlier);
      if (rawEarlier && isFinite(amountEarlier) && amountEarlier > 0) {
        hasEarlierAmount = true;
        others += amountEarlier;
      }
    }
    if (!hasEarlierAmount) {
      setAmount(lastRow, 0);
      return;
    }
    setAmount(lastRow, roundSplitMoney(target - others));
  }

  function syncSingleSplitAmount(){
    var rows = splitRows();
    if (rows.length !== 1) {
      syncRemainingSplitAmount(null);
      refreshSplitBalance();
      return;
    }
    var amountInput = rows[0].querySelector('.cp-split-amount');
    if (amountInput) amountInput.value = String(paymentTotalNow() || '');
    refreshSplitBalance();

  function updateSplitRemoveButtons(){
    if (!splitsRoot) return;
    var rows = splitRows();
    var multi = rows.length > 1;
    rows.forEach(function(row){
      var removeBtn = row.querySelector('.cp-split-remove');
      var amountInput = row.querySelector('.cp-split-amount');
      if (removeBtn) removeBtn.hidden = !multi;
      if (amountInput) {
        amountInput.hidden = !multi;
        amountInput.required = multi;
      }
      row.classList.toggle('is-multi', multi);
    });
    if (splitBalance) splitBalance.hidden = !multi;
    refreshSplitBalance();
  }

  function refreshSplitBalance(){
    var target = paymentTotalNow();
    if (splitTargetEl) {
      splitTargetEl.setAttribute('data-amount', String(target));
      splitTargetEl.textContent = formatInr(target);
    }
    var total = 0;
    var allFilled = true;
    var modesSelected = true;
    var multi = false;
    if (splitMode && splitsRoot) {
      var rows = splitRows();
      multi = rows.length > 1;
      rows.forEach(function(row){
        if (!splitRowMethodValue(row)) modesSelected = false;
        var input = row.querySelector('.cp-split-amount');
        if (!input || input.hidden) return;
        var raw = String(input.value || '').trim();
        var amount = Number(raw);
        if (multi && (!raw || !isFinite(amount) || amount <= 0)) allFilled = false;
        total += isFinite(amount) ? amount : 0;
      });
      if (rows.length === 1) total = target;
    } else if (currentMethodValue() === 'bor') {
      collectBorAllocationsFromPanel().forEach(function(row){ total += Number(row.amount || 0); });
    } else {
      total = target;
    }
    total = roundSplitMoney(total);
    if (splitTotalEl) {
      splitTotalEl.setAttribute('data-amount', String(total));
      splitTotalEl.textContent = formatInr(total);
    }
    if (splitBalance) {
      var mismatch = multi && (!allFilled || !modesSelected || Math.abs(total - target) > 0.001);
      splitBalance.classList.toggle('is-mismatch', mismatch);
    }
    var borApplyEl = document.getElementById('cp-bor-apply-total');
    if (borApplyEl) {
      var borTotal = 0;
      collectBorAllocationsFromPanel().forEach(function(row){ borTotal += Number(row.amount || 0); });
      borTotal = roundSplitMoney(borTotal);
      borApplyEl.setAttribute('data-amount', String(borTotal));
      borApplyEl.textContent = formatInr(borTotal);
    }
  }

  function collectPaymentSplits(){

  async function submitClearance(){
    if (!canMutate) return;
    if (!pendingSelections.length) {
      setError(clearanceError, 'Select at least one expense.');
      return;
    }
    var method = showPaymentMode ? currentMethodValue() : 'cash';
    var transactionId = showPaymentMode && transactionEl ? transactionEl.value.trim() : '';
    if (showPaymentMode && requirePaymentMethod && !method && !splitMode) {
      setError(clearanceError, labels.select_error_method || 'Select a payment mode.');
      return;
    }
    if (showPaymentMode && !splitMode && methodRequiresTxn(method) && !transactionId) {
      setError(clearanceError, 'Transaction ID is required for bank transfer.');
      return;
    }
    var allocations = [];
    var invalid = false;
    allocBody.querySelectorAll('tr').forEach(function(tr, index){
      var input = tr.querySelector('.cp-alloc-input');
      var amount = Number(input && input.value);
      var pending = pendingSelections[index];
      var max = pending ? pending.balance : Number(input && input.getAttribute('max'));
      if (!amount || amount <= 0 || amount > max + 0.001) {
        invalid = true;
        return;
      }
      allocations.push({
        expense_id: Number(tr.getAttribute('data-expense-id')),
        amount: amount
      });
    });
    if (invalid || !allocations.length) {
      setError(clearanceError, 'Enter a valid pay amount for each expense.');
      return;
    }

    var extras = {
      payment_date: autoClearanceDate
        ? todayIso
        : (paymentDateEl && paymentDateEl.value ? paymentDateEl.value : todayIso),
      payment_method: method || 'cash',
      transaction_id: transactionId,
      notes: notesEl ? notesEl.value.trim() : ''
    };
    if (splitMode) {
      var splits = collectPaymentSplits() || [];
      if (!splits.length) {
        setError(clearanceError, 'Add at least one payment mode.');
        return;
      }
      extras.payment_splits = splits;
      extras.payment_method = splits.length === 1 ? splits[0].method : 'split';
    } else if (method === 'bor') {
      var borRows = collectBorAllocationsFromPanel();
      if (!borRows.length) {
        setError(clearanceError, 'Select at least one Back Office Receipt to apply.');
        return;
      }
      var borTotal = 0;
      borRows.forEach(function(row){ borTotal += Number(row.amount || 0); });
      borTotal = Math.round(borTotal * 100) / 100;
      var payTotal = paymentTotalNow();
      if (Math.abs(borTotal - payTotal) > 0.009) {
        setError(
          clearanceError,
          'Back Office Receipt total ' + formatInr(borTotal) + ' must equal payment total ' + formatInr(payTotal) + '.'
        );
        return;
      }
      extras.payment_splits = borRows.map(function(row){
        return {
          method: 'bor',
          amount: row.amount,
          receipt_id: row.receipt_id,
          transaction_id: ''
        };
      });
    }

    var submitBtn = document.getElementById('cp-clearance-submit');
    if (submitBtn) submitBtn.disabled = true;
    setError(clearanceError, '');
    try {
      await postSettlementGroups(pendingSelections, allocations, extras);
      if (typeof window.deInvalidateSoftNavCacheByPath === 'function') {
        try {
          window.deInvalidateSoftNavCacheByPath('/hotel/credit');
          window.deInvalidateSoftNavCacheByPath('/reports/sales');
        } catch (eInv) {}
      }
      if (typeof window.deSoftRefresh === 'function') window.deSoftRefresh();
      else window.location.reload();
    } catch (err) {
      setError(
        clearanceError,
        (err && err.message) || labels.submit_error_network || 'Network error while recording payment.'
      );
    } finally {
      if (submitBtn) submitBtn.disabled = false;
    }
  }

  async function postSettlementGroups(selections, allocations, extras){
    var pendingByExpense = {};
    selections.forEach(function(item){
      pendingByExpense[String(item.expense_id)] = item;
    });
    var groups = {};
    allocations.forEach(function(allocation){
      var pending = pendingByExpense[String(allocation.expense_id)];
      var supplierId = pending ? Number(pending.supplier_id || 0) : 0;
      if (!groups[supplierId]) groups[supplierId] = [];
      groups[supplierId].push(allocation);
    });
    var groupIds = Object.keys(groups);
    for (var i = 0; i < groupIds.length; i++) {
      var supplierId = Number(groupIds[i]);
      var res = await fetch(createUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          supplier_id: supplierId,
          payment_date: extras.payment_date || todayIso,
          payment_method: extras.payment_method || 'cash',
          transaction_id: extras.transaction_id || '',
          notes: extras.notes || '',
          allocations: groups[groupIds[i]],
          payment_splits: extras.payment_splits || undefined,
          bor_allocations: extras.bor_allocations || undefined
        })
      });
      var data = await res.json();
      if (!data.ok) {
        var message = data.error || labels.submit_error_record || 'Unable to record payment.';
        var err = new Error(message);
        throw err;
      }
    }
  }

      return '<tr>' +
        '<td><span class="cp-alloc-code">' + escapeHtml(item.expense_code || '—') + '</span>' + escapeHtml(item.description || '—') +
        '<div class="pl-meta">' + escapeHtml(reportDt(item.sales_date || '')) + (cat && cat !== '—' ? ' · ' + cat : '') + '</div></td>' +
        '<td class="pl-col-amount">' + formatInr(item.amount) + '</td>' +
        '</tr>';
    }).join('');
    detailBody.innerHTML =
      '<div class="cp-detail-meta">' +
        '<div><span class="cp-detail-label">' + escapeHtml(labels.detail_date_label || 'Payment date') + '</span><span class="cp-detail-value">' + escapeHtml(reportDt(payment.payment_date || '—')) + '</span></div>' +
        '<div><span class="cp-detail-label">' + escapeHtml(labels.detail_party_label || 'Supplier') + '</span><span class="cp-detail-value">' + escapeHtml(payment.supplier_name || '—') + '</span></div>' +
        (showPaymentMode
          ? '<div><span class="cp-detail-label">' + escapeHtml((labels.clearance_mode_label || 'Payment mode *').replace(' *', '')) + '</span><span class="cp-detail-value">' + escapeHtml(methodLabel) + '</span></div>' +
            '<div><span class="cp-detail-label">Transaction ID</span><span class="cp-detail-value">' + escapeHtml(payment.transaction_id || '—') + '</span></div>'
          : '') +
        (showVerificationAccount
          ? '<div><span class="cp-detail-label">' + escapeHtml(labels.clearance_account_label || 'Account') + '</span><span class="cp-detail-value">' + escapeHtml(accountLabel) + '</span></div>'
          : '') +
        '<div><span class="cp-detail-label">Total</span><span class="cp-detail-value">' + formatInr(payment.total_amount) + '</span></div>' +
        '<div><span class="cp-detail-label">Notes</span><span class="cp-detail-value">' + escapeHtml(payment.notes || '—') + '</span></div>' +
      '</div>' +
      modeHtml +
      '<div class="cp-alloc-wrap">' +
        '<div class="cp-alloc-head"><span>' + escapeHtml(labels.detail_alloc_head || 'Allocated expenses') + '</span><span>' + ((payment.allocations || []).length) + '</span></div>' +
        '<div class="cp-alloc-table-wrap"><table class="cp-alloc-table"><thead><tr><th>' + escapeHtml(labels.alloc_item_column || 'Expense') + '</th><th class="pl-col-amount">Paid</th></tr></thead><tbody>' +
        (rows || '<tr><td colspan="2">No allocations</td></tr>') +
        '</tbody></table></div>' +
      '</div>';
  }

  async function viewPayment(paymentId){
    setError(detailError, '');
    if (detailBody) detailBody.innerHTML = '<p>Loading…</p>';
    openModal(detailModal);
    try {
      var res = await fetch(detailUrl(paymentId));
      var data = await res.json();
      if (!data.ok) {
        setError(detailError, data.error || labels.detail_error_load || 'Unable to load payment.');
        return;
      }
      renderPaymentDetail(data.payment);
    } catch (err) {
      setError(detailError, labels.detail_error_network || 'Network error while loading payment.');
    }
  }

  async function deletePayment(paymentId){
    if (!canMutate) return;
    var ok = typeof window.deConfirm === 'function'
      ? await window.deConfirm(labels.delete_confirm || 'Delete this payment? Outstanding balances will be restored.')
      : window.confirm(labels.delete_confirm || 'Delete this payment? Outstanding balances will be restored.');
    if (!ok) return;
    try {
      var res = await fetch(deleteUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ payment_id: paymentId })
      });
      var data = await res.json();
      if (!data.ok) {
        window.alert(data.error || labels.delete_error || 'Unable to delete payment.');
        return;
      }
      if (typeof window.deInvalidateSoftNavCacheByPath === 'function') {
        try {
          window.deInvalidateSoftNavCacheByPath('/hotel/credit');
          window.deInvalidateSoftNavCacheByPath('/reports/sales');
        } catch (eInv) {}
      }
      if (typeof window.deSoftRefresh === 'function') window.deSoftRefresh();
      else window.location.reload();
    } catch (err) {
      window.alert(labels.delete_error_network || 'Network error while deleting payment.');
    }
  }

  document.querySelectorAll('.cp-view-payment').forEach(function(btn){
    btn.addEventListener('click', function(){ viewPayment(btn.getAttribute('data-payment-id')); });
  });
  document.querySelectorAll('.cp-delete-payment').forEach(function(btn){
    btn.addEventListener('click', function(){ deletePayment(btn.getAttribute('data-payment-id')); });
  });
  if (detailClose) detailClose.addEventListener('click', function(){ closeModal(detailModal); });
  if (detailModal) {
    detailModal.addEventListener('click', function(e){
      if (e.target === detailModal) closeModal(detailModal);
    });
  }

  /* ---------- Sortable table headers ---------- */
  function initSortableTable(table){
    if (!table) return;
    var tbody = table.tBodies[0];
    if (!tbody) return;
    var headers = Array.from(table.querySelectorAll('th.pl-sortable'));
    if (!headers.length) return;
    var activeKey = '';
    var ascending = true;

    function cellSortValue(row, colIndex, type){
      var cell = row.cells[colIndex];
      if (!cell) return type === 'number' ? 0 : '';
      var raw = cell.getAttribute('data-sort-value');
      if (raw == null || raw === '') raw = (cell.textContent || '').trim();
      if (type === 'number') {
        var n = Number(raw);
        return isFinite(n) ? n : 0;
      }
      return String(raw).toLowerCase();
    }

    function sortBy(th){
      var key = th.getAttribute('data-sort') || '';
      var type = th.getAttribute('data-sort-type') || 'text';
      var colIndex = Array.from(th.parentNode.children).indexOf(th);
      if (colIndex < 0) return;

      if (activeKey === key) ascending = !ascending;
      else {
        activeKey = key;
        ascending = true;
      }

      var rows = Array.from(tbody.rows);
      rows.sort(function(a, b){
        var av = cellSortValue(a, colIndex, type);
        var bv = cellSortValue(b, colIndex, type);
        var cmp = type === 'number'
          ? av - bv
          : String(av).localeCompare(String(bv), undefined, { numeric: true, sensitivity: 'base' });
        return ascending ? cmp : -cmp;
      });
      rows.forEach(function(row){ tbody.appendChild(row); });

      headers.forEach(function(header){
        header.classList.remove('is-sorted-asc', 'is-sorted-desc');
        header.setAttribute('aria-sort', 'none');
      });
      th.classList.add(ascending ? 'is-sorted-asc' : 'is-sorted-desc');
      th.setAttribute('aria-sort', ascending ? 'ascending' : 'descending');
    }

    headers.forEach(function(th){
      th.addEventListener('click', function(){ sortBy(th); });
      th.addEventListener('keydown', function(e){
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          sortBy(th);
        }
      });
    });
  }

  initSortableTable(document.getElementById('cp-outstanding-table'));
  initSortableTable(document.querySelector('table.cp-table'));

  if (typeof window.initHotelDatePickers === 'function') {
    window.initHotelDatePickers(document.getElementById('cp-clearance-modal') || document);
  }
})();
</script>
