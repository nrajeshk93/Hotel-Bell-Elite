<script>
(function(){
  var page = document.querySelector('.main-wrapper');
  if (!page) return;

  var addUrl = {{ purchase_add_url|tojson }};
  var editUrl = {{ purchase_edit_url|tojson }};
  var deleteUrl = {{ purchase_delete_url|tojson }};
  var supplierCreateUrl = {{ supplier_create_url|tojson }};
  var defaultCompany = {{ default_company|tojson }};
  var defaultLocation = {{ default_location|tojson }};
  var todayIso = {{ today_iso|tojson }};
  var paymentLabels = {{ expense_payment_labels|tojson }};
  var categoryLabels = {{ expense_category_labels|tojson }};
  var purchaseAddCategories = {{ purchase_add_categories|default([])|tojson }};
  var expenseAddCategories = {{ expense_add_categories|default([])|tojson }};
  var availableCashUrl = {{ available_cash_url|tojson }};
  var availableCash = Number({{ available_cash|default(0)|tojson }} || 0);

  var modal = document.getElementById('pl-add-purchase-modal');
  var openBtn = document.getElementById('pl-open-add-purchase');
  var cancelBtn = document.getElementById('pl-add-purchase-cancel');
  var saveBtn = document.getElementById('pl-add-purchase-save');
  var saveLabel = document.getElementById('pl-add-purchase-save-label');
  var requiredNoticeEl = document.getElementById('pl-add-required-notice');
  var titleEl = document.getElementById('pl-add-purchase-title');
  var availableWrap = document.getElementById('pl-add-available-wrap');
  var availableCashEl = document.getElementById('pl-add-available-cash');
  var errorEl = document.getElementById('pl-add-purchase-error');
  var expenseIdEl = document.getElementById('pl-edit-expense-id');
  var dateEl = document.getElementById('pl-add-purchase-date');
  var descriptionEl = document.getElementById('pl-add-description');
  var amountEl = document.getElementById('pl-add-amount');
  var invoiceEl = document.getElementById('pl-add-invoice-number');
  var transactionWrap = document.getElementById('pl-add-transaction-wrap');
  var transactionEl = document.getElementById('pl-add-transaction-id');
  var editingExpenseId = null;
  var availableFetchToken = 0;

  function formatAvailableCash(amount){
    if (typeof window.formatINR === 'function') return window.formatINR(amount, 0);
    var n = Number(amount || 0);
    return isFinite(n) ? '₹' + n.toLocaleString('en-IN', { maximumFractionDigits: 0 }) : '₹0';
  }

  function syncAvailableCashDisplay(){
    var paymentInput = document.getElementById('pl-add-payment');
    var method = paymentInput ? (paymentInput.value || '') : '';
    var isCash = method === 'cash';
    if (availableWrap) availableWrap.hidden = !isCash;
    if (availableCashEl) availableCashEl.textContent = formatAvailableCash(availableCash);
  }

  async function refreshAvailableCash(){
    if (!availableCashUrl) {
      syncAvailableCashDisplay();
      return;
    }
    var token = ++availableFetchToken;
    var purchaseDate = dateEl && dateEl.value ? dateEl.value : todayIso;
    var url = new URL(availableCashUrl, window.location.origin);
    url.searchParams.set('company', defaultCompany);
    url.searchParams.set('date', purchaseDate);
    if (editingExpenseId) url.searchParams.set('exclude_expense_id', editingExpenseId);
    try {
      var res = await fetch(url.toString(), { headers: { 'Accept': 'application/json' } });
      var data = await res.json().catch(function(){ return {}; });
      if (token !== availableFetchToken) return;
      if (res.ok && data.ok) availableCash = Number(data.available_cash || 0);
    } catch (err) {
      /* keep last known availableCash */
    }
    if (token === availableFetchToken) syncAvailableCashDisplay();
  }

  function setError(msg){
    if (!errorEl) return;
    if (msg) {
      errorEl.textContent = msg;
      errorEl.style.display = 'block';
    } else {
      errorEl.textContent = '';
      errorEl.style.display = 'none';
    }
  }

  function openModal(el){
    if (!el) return;
    el.classList.add('open');
    el.setAttribute('aria-hidden', 'false');
  }

  function closeModal(el){
    if (!el) return;
    el.classList.remove('open');
    el.setAttribute('aria-hidden', 'true');
    if (el === modal && typeof window.closeHotelDatePickers === 'function') {
      window.closeHotelDatePickers();
    }
  }

  function closeAllListboxes() {
    if (typeof window.closeAllEpListboxes === 'function') window.closeAllEpListboxes();
  }

  window.plAddPaymentChanged = function () {
    syncTransactionVisibility();
    syncSaveEnabled();
  };

  window.plAddFieldChanged = function () {
    syncSaveEnabled();
  };

  function isFormReady() {
    var entryKind = document.getElementById('pl-add-kind') ? document.getElementById('pl-add-kind').value : '';
    var purchaseDate = dateEl ? String(dateEl.value || '').trim() : '';
    var supplierId = document.getElementById('pl-add-supplier') ? document.getElementById('pl-add-supplier').value : '';
    var category = document.getElementById('pl-add-category') ? document.getElementById('pl-add-category').value : '';
    var description = descriptionEl ? descriptionEl.value.trim() : '';
    var amountRaw = amountEl ? amountEl.value : '';
    var paymentType = document.getElementById('pl-add-payment') ? document.getElementById('pl-add-payment').value : '';
    var transactionId = transactionEl ? transactionEl.value.trim() : '';
    if (entryKind !== 'purchase' && entryKind !== 'expense') return false;
    if (!purchaseDate) return false;
    if (!supplierId) return false;
    if (!category) return false;
    if (!description) return false;
    if (!amountRaw || !(Number(amountRaw) > 0)) return false;
    if (!paymentType) return false;
    if (paymentType === 'bank_transfer' && !transactionId) return false;
    return true;
  }

  function syncSaveEnabled() {
    var ready = isFormReady();
    var saving = !!(saveBtn && saveBtn.getAttribute('data-pl-saving') === '1');
    var showButton = saving || ready;
    if (requiredNoticeEl) {
      requiredNoticeEl.hidden = showButton;
      requiredNoticeEl.setAttribute('aria-hidden', showButton ? 'true' : 'false');
    }
    if (!saveBtn) return;
    saveBtn.hidden = !showButton;
    saveBtn.setAttribute('aria-hidden', showButton ? 'false' : 'true');
    saveBtn.disabled = saving ? true : !ready;
  }

  function setKindValue(value) {
    var raw = String(value || '').trim().toLowerCase();
    var kind = raw === 'expense' ? 'expense' : (raw === 'purchase' ? 'purchase' : '');
    var hidden = document.getElementById('pl-add-kind');
    if (hidden) hidden.value = kind;
    var tabs = document.querySelectorAll('#pl-add-kind-tabs .pl-kind-tab');
    tabs.forEach(function (tab) {
      var selected = !!kind && String(tab.getAttribute('data-value') || '') === kind;
      tab.classList.toggle('is-active', selected);
      tab.setAttribute('aria-selected', selected ? 'true' : 'false');
    });
    setModalMode(!!editingExpenseId);
    rebuildAddCategoryOptions(kind);
    syncSaveEnabled();
  }

  function categoryPairsForKind(kind) {
    if (kind === 'purchase' && purchaseAddCategories && purchaseAddCategories.length) return purchaseAddCategories;
    if (kind === 'expense' && expenseAddCategories && expenseAddCategories.length) return expenseAddCategories;
    var seen = {};
    var union = [];
    function addAll(list) {
      (list || []).forEach(function (pair) {
        var key = pair && pair[0];
        var label = pair && pair[1];
        if (!key || seen[key]) return;
        seen[key] = true;
        union.push([key, label]);
      });
    }
    addAll(purchaseAddCategories);
    addAll(expenseAddCategories);
    return union;
  }

  function rebuildAddCategoryOptions(kind) {
    var options = document.getElementById('pl-add-category-options');
    var hidden = document.getElementById('pl-add-category');
    if (!options) return;
    var pairs = categoryPairsForKind(kind);
    if (!pairs.length) return;
    var current = hidden ? hidden.value : '';
    var labels = {};
    options.innerHTML = '';
    pairs.forEach(function (pair) {
      var key = pair[0];
      var label = pair[1];
      labels[key] = label;
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'se-filter-listbox-option staff-category-option';
      btn.setAttribute('role', 'option');
      btn.setAttribute('data-value', key);
      btn.setAttribute('data-name', String(label || '').toLowerCase());
      btn.setAttribute('data-label', label);
      btn.setAttribute('aria-selected', key === current ? 'true' : 'false');
      if (key === current) btn.classList.add('is-selected');
      btn.textContent = label;
      options.appendChild(btn);
    });
    Object.keys(labels).forEach(function (key) { categoryLabels[key] = labels[key]; });
    if (current && !labels[current]) {
      setListboxValue('pl-add-category', '', '', 'Select category');
    } else if (typeof window.initEpListboxes === 'function') {
      window.initEpListboxes();
    }
  }

  function setPurchaseDate(iso) {
    var next = iso || todayIso;
    if (typeof window.setHotelDateValue === 'function') {
      window.setHotelDateValue('pl-add-purchase-date', next);
      syncSaveEnabled();
      return;
    }
    if (dateEl) dateEl.value = next;
    syncSaveEnabled();
  }

  function initPlAddDatePicker() {
    if (typeof window.initHotelDatePickers === 'function') {
      window.initHotelDatePickers(modal || document);
    }
  }

  function setListboxValue(prefix, value, label, placeholder) {
    if (typeof window.resetEpListbox === 'function') {
      window.resetEpListbox(prefix, value || '', value ? (label || value) : (placeholder || 'Select'));
      syncSaveEnabled();
      return;
    }
    var hidden = document.getElementById(prefix);
    var valueEl = document.getElementById(prefix + '-value');
    var list = document.getElementById(prefix + '-list');
    if (hidden) hidden.value = value || '';
    if (valueEl) {
      if (value) {
        valueEl.textContent = label || value;
        valueEl.classList.remove('staff-supplier-placeholder');
      } else {
        valueEl.textContent = placeholder || 'Select';
        valueEl.classList.add('staff-supplier-placeholder');
      }
    }
    if (list) {
      list.querySelectorAll('.se-filter-listbox-option').forEach(function (opt) {
        var selected = String(opt.getAttribute('data-value') || '') === String(value || '');
        opt.classList.toggle('is-selected', selected);
        opt.setAttribute('aria-selected', selected ? 'true' : 'false');
      });
    }
    syncSaveEnabled();
  }

  function initPlAddListboxes() {
    if (typeof window.initEpListboxes === 'function') window.initEpListboxes();
  }

  function syncTransactionVisibility(){
    var paymentInput = document.getElementById('pl-add-payment');
    var method = paymentInput ? (paymentInput.value || '') : '';
    if (transactionWrap) transactionWrap.hidden = method !== 'bank_transfer';
    if (method !== 'bank_transfer' && transactionEl) transactionEl.value = '';
    syncAvailableCashDisplay();
  }

  function setModalMode(isEdit){
    var kindInput = document.getElementById('pl-add-kind');
    var kind = kindInput ? (kindInput.value || '') : '';
    var kindLabel = kind === 'expense' ? 'Expense' : (kind === 'purchase' ? 'Purchase' : 'Entry');
    if (titleEl) titleEl.textContent = isEdit ? ('Edit ' + kindLabel) : ('Add ' + kindLabel);
    if (saveLabel) {
      saveLabel.textContent = isEdit
        ? 'Save changes'
        : (kind ? ('Add ' + kindLabel.toLowerCase()) : 'Add entry');
    }
  }

  function resetForm(){
    editingExpenseId = null;
    if (expenseIdEl) expenseIdEl.value = '';
    setError('');
    setPurchaseDate(todayIso);
    if (descriptionEl) descriptionEl.value = '';
    if (amountEl) amountEl.value = '';
    if (invoiceEl) invoiceEl.value = '';
    if (transactionEl) transactionEl.value = '';
    setKindValue('');
    setListboxValue('pl-add-supplier', '', '', 'Select supplier');
    setListboxValue('pl-add-category', '', '', 'Select category');
    setListboxValue('pl-add-payment', '', '', 'Select payment type');
    setModalMode(false);
    syncTransactionVisibility();
    closeAllListboxes();
    if (typeof window.closeHotelDatePickers === 'function') window.closeHotelDatePickers();
    refreshAvailableCash();
    syncSaveEnabled();
  }

  function openPurchaseModal(){
    resetForm();
    openModal(modal);
    initPlAddListboxes();
    initPlAddDatePicker();
    if (descriptionEl) descriptionEl.focus();
  }

  function openEditModal(btn){
    if (!btn) return;
    resetForm();
    editingExpenseId = btn.getAttribute('data-expense-id') || '';
    if (expenseIdEl) expenseIdEl.value = editingExpenseId;
    setModalMode(true);
    setPurchaseDate(btn.getAttribute('data-date') || todayIso);
    if (descriptionEl) descriptionEl.value = btn.getAttribute('data-description') || '';
    if (amountEl) amountEl.value = btn.getAttribute('data-amount') || '';
    if (invoiceEl) invoiceEl.value = btn.getAttribute('data-invoice') || '';
    var category = btn.getAttribute('data-category') || '';
    var categoryLabel = btn.getAttribute('data-category-label') || (categoryLabels[category] || category);
    setListboxValue('pl-add-category', category, categoryLabel, 'Select category');
    setListboxValue(
      'pl-add-supplier',
      btn.getAttribute('data-supplier-id') || '',
      btn.getAttribute('data-supplier-name') || '',
      'Select supplier'
    );
    var paymentType = btn.getAttribute('data-payment-type') || 'credit';
    setListboxValue('pl-add-payment', paymentType, paymentLabels[paymentType] || paymentType);
    var entryKind = btn.getAttribute('data-entry-kind') || 'expense';
    setKindValue(entryKind);
    if (transactionEl) transactionEl.value = btn.getAttribute('data-transaction-id') || '';
    syncTransactionVisibility();
    refreshAvailableCash();
    openModal(modal);
    initPlAddListboxes();
    initPlAddDatePicker();
    syncSaveEnabled();
    if (descriptionEl) descriptionEl.focus();
  }

  if (openBtn) openBtn.addEventListener('click', openPurchaseModal);
  if (cancelBtn) cancelBtn.addEventListener('click', function(){ closeModal(modal); });
  if (modal) {
    modal.addEventListener('click', function(e){
      if (e.target === modal) closeModal(modal);
    });
  }

  async function deletePurchase(btn){
    if (!btn || !deleteUrl) return;
    var expenseId = btn.getAttribute('data-expense-id') || '';
    var expenseCode = btn.getAttribute('data-expense-code') || expenseId;
    if (!expenseId) return;
    var confirmMsg = 'Cancel ' + expenseCode + '? The ID is kept, status becomes Cancelled, and this number cannot be reused.';
    var ok = typeof window.deConfirm === 'function'
      ? await window.deConfirm(confirmMsg)
      : window.confirm(confirmMsg);
    if (!ok) return;
    btn.disabled = true;
    try {
      var res = await fetch(deleteUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ expense_id: expenseId })
      });
      var data = await res.json();
      if (!data.ok) throw new Error(data.error || 'Could not cancel this entry.');
      if (typeof window.deSoftRefresh === 'function') window.deSoftRefresh();
      else window.location.reload();
    } catch (err) {
      window.alert(err.message || 'Could not cancel this entry.');
      btn.disabled = false;
    }
  }

  document.addEventListener('click', function(e){
    if (!e.target.closest('#pl-add-purchase-modal [data-se-listbox]')) closeAllListboxes();
    var editBtn = e.target.closest('.pl-edit-btn');
    if (editBtn) {
      e.preventDefault();
      openEditModal(editBtn);
      return;
    }
    var deleteBtn = e.target.closest('.pl-delete-btn');
    if (deleteBtn) {
      e.preventDefault();
      deletePurchase(deleteBtn);
    }
  });

  async function submitPurchase(){
    var purchaseDate = dateEl ? dateEl.value : todayIso;
    var description = descriptionEl ? descriptionEl.value.trim() : '';
    var amountRaw = amountEl ? amountEl.value : '';
    var supplierId = document.getElementById('pl-add-supplier') ? document.getElementById('pl-add-supplier').value : '';
    var category = document.getElementById('pl-add-category') ? document.getElementById('pl-add-category').value : '';
    var paymentType = document.getElementById('pl-add-payment') ? document.getElementById('pl-add-payment').value : '';
    var entryKind = document.getElementById('pl-add-kind') ? document.getElementById('pl-add-kind').value : '';
    if (entryKind !== 'purchase' && entryKind !== 'expense') {
      setError('Please select Purchase or Expense.');
      return;
    }
    var transactionId = transactionEl ? transactionEl.value.trim() : '';
    var invoiceNumber = invoiceEl ? invoiceEl.value.trim() : '';

    if (!purchaseDate) {
      setError('Please select a purchase date.');
      return;
    }
    if (!supplierId) {
      setError('Please select a supplier.');
      return;
    }
    if (!category) {
      setError('Please select a category.');
      return;
    }
    if (!description) {
      setError('Please enter an expense description.');
      return;
    }
    if (!amountRaw || Number(amountRaw) <= 0) {
      setError('Please enter a value greater than 0.');
      return;
    }
    if (!paymentType) {
      setError('Please select a payment type.');
      return;
    }
    if (paymentType === 'bank_transfer' && !transactionId) {
      setError('Please enter the bank transaction ID.');
      return;
    }
    if (paymentType === 'cash' && Number(amountRaw) - Number(availableCash) > 0.001) {
      setError('Cash expense cannot be more than available cash (' + formatAvailableCash(availableCash) + ').');
      return;
    }

    setError('');
    if (saveBtn) {
      saveBtn.setAttribute('data-pl-saving', '1');
      saveBtn.disabled = true;
    }
    var isEdit = !!editingExpenseId;
    var payload = {
      company: defaultCompany,
      location: defaultLocation,
      date: purchaseDate,
      description: description,
      amount: amountRaw,
      payment_type: paymentType,
      category: category,
      entry_kind: entryKind,
      transaction_id: paymentType === 'bank_transfer' ? transactionId : '',
      invoice_number: invoiceNumber,
      supplier_id: supplierId
    };
    if (isEdit) payload.expense_id = editingExpenseId;
    try {
      var res = await fetch(isEdit ? editUrl : addUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      var data = await res.json();
      if (!data.ok) throw new Error(data.error || (isEdit ? 'Could not update purchase.' : 'Could not save purchase.'));
      closeModal(modal);
      var url = new URL(window.location.href);
      var savedDate = data.sales_date || purchaseDate;
      if (savedDate) {
        url.searchParams.set('date_from', savedDate);
        url.searchParams.set('date_to', savedDate);
      }
      if (typeof window.deSoftRefresh === 'function') window.deSoftRefresh(url.toString());
      else window.location.href = url.toString();
    } catch (err) {
      setError(err.message || (isEdit ? 'Could not update purchase.' : 'Could not save purchase.'));
    } finally {
      if (saveBtn) saveBtn.removeAttribute('data-pl-saving');
      syncSaveEnabled();
    }
  }

  if (saveBtn) saveBtn.addEventListener('click', submitPurchase);
  if (dateEl) {
    dateEl.addEventListener('change', function () {
      refreshAvailableCash();
      syncSaveEnabled();
    });
  }
  if (descriptionEl) descriptionEl.addEventListener('input', syncSaveEnabled);
  if (amountEl) amountEl.addEventListener('input', syncSaveEnabled);
  if (transactionEl) transactionEl.addEventListener('input', syncSaveEnabled);
  if (modal) {
    modal.addEventListener('change', function (e) {
      if (!e.target) return;
      if (e.target.id === 'pl-add-supplier' || e.target.id === 'pl-add-category' || e.target.id === 'pl-add-payment' || e.target.id === 'pl-add-kind' || e.target.id === 'pl-add-purchase-date') {
        syncSaveEnabled();
      }
    });
  }

  var kindTabs = document.getElementById('pl-add-kind-tabs');
  if (kindTabs && kindTabs.getAttribute('data-pl-kind-bound') !== '1') {
    kindTabs.setAttribute('data-pl-kind-bound', '1');
    kindTabs.addEventListener('click', function (e) {
      var tab = e.target.closest('.pl-kind-tab');
      if (!tab || !kindTabs.contains(tab)) return;
      setKindValue(tab.getAttribute('data-value') || '');
    });
  }

  /* Inline supplier add */
  var supplierModal = document.getElementById('pl-add-supplier-modal');
  var supplierOpenBtn = document.getElementById('pl-add-supplier-btn');
  var supplierCancelBtn = document.getElementById('pl-add-supplier-cancel');
  var supplierSaveBtn = document.getElementById('pl-add-supplier-save');
  var supplierErrorEl = document.getElementById('pl-add-supplier-add-error');
  var supplierOptions = document.getElementById('pl-add-supplier-options');

  function setSupplierError(msg){
    if (!supplierErrorEl) return;
    if (msg) {
      supplierErrorEl.textContent = msg;
      supplierErrorEl.style.display = 'block';
    } else {
      supplierErrorEl.textContent = '';
      supplierErrorEl.style.display = 'none';
    }
  }

  function appendSupplierOption(supplier){
    if (!supplierOptions || !supplier) return;
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'se-filter-listbox-option staff-supplier-option is-selected';
    btn.setAttribute('role', 'option');
    btn.setAttribute('data-value', String(supplier.id));
    btn.setAttribute('data-name', String(supplier.name || '').toLowerCase() + ' ' + String(supplier.gst || '').toLowerCase());
    btn.setAttribute('data-label', String(supplier.name || ''));
    btn.setAttribute('aria-selected', 'true');
    btn.innerHTML =
      '<span class="staff-supplier-option-name">' + (supplier.name || '') + '</span>' +
      '<span class="staff-supplier-option-gst">' + (supplier.gst || '') + '</span>';
    supplierOptions.querySelectorAll('.se-filter-listbox-option').forEach(function(opt){
      opt.classList.remove('is-selected');
      opt.setAttribute('aria-selected', 'false');
    });
    var newName = String(supplier.name || '').toLowerCase();
    var existing = Array.from(supplierOptions.querySelectorAll('.staff-supplier-option'));
    var insertBefore = existing.find(function(opt){
      return (opt.getAttribute('data-name') || '') > newName;
    });
    if (insertBefore) supplierOptions.insertBefore(btn, insertBefore);
    else supplierOptions.appendChild(btn);
    setListboxValue('pl-add-supplier', String(supplier.id), supplier.name || '', 'Select supplier');
  }

  async function saveSupplier(){
    var payload = {
      name: document.getElementById('pl-add-supplier-name') ? document.getElementById('pl-add-supplier-name').value.trim() : '',
      gst: document.getElementById('pl-add-supplier-gst') ? document.getElementById('pl-add-supplier-gst').value.trim() : '',
      phone: document.getElementById('pl-add-supplier-phone') ? document.getElementById('pl-add-supplier-phone').value.trim() : '',
      address: document.getElementById('pl-add-supplier-address') ? document.getElementById('pl-add-supplier-address').value.trim() : ''
    };
    if (!payload.name) {
      setSupplierError('Supplier name is required.');
      return;
    }
    setSupplierError('');
    if (supplierSaveBtn) supplierSaveBtn.disabled = true;
    try {
      var res = await fetch(supplierCreateUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      var data = await res.json();
      if (!data.ok) throw new Error(data.error || 'Could not save supplier.');
      appendSupplierOption(data.supplier);
      closeModal(supplierModal);
    } catch (err) {
      setSupplierError(err.message || 'Could not save supplier.');
    } finally {
      if (supplierSaveBtn) supplierSaveBtn.disabled = false;
    }
  }

  if (supplierOpenBtn) {
    supplierOpenBtn.addEventListener('click', function(){
      setSupplierError('');
      ['pl-add-supplier-name', 'pl-add-supplier-gst', 'pl-add-supplier-phone', 'pl-add-supplier-address'].forEach(function(id){
        var el = document.getElementById(id);
        if (el) el.value = '';
      });
      openModal(supplierModal);
    });
  }
  if (supplierCancelBtn) supplierCancelBtn.addEventListener('click', function(){ closeModal(supplierModal); });
  if (supplierSaveBtn) supplierSaveBtn.addEventListener('click', saveSupplier);
  if (supplierModal) {
    supplierModal.addEventListener('click', function(e){
      if (e.target === supplierModal) closeModal(supplierModal);
    });
  }

  initPlAddDatePicker();
  syncSaveEnabled();
})();
</script>
