{# Shared Payment Details / Settle Bill dialog — Create Invoice + Tables. #}
<div class="pos-inv-modal" id="pos-inv-settle-modal" hidden>
  <div class="pos-inv-modal-backdrop" data-settle-close tabindex="-1" aria-hidden="true"></div>
  <div class="staff-credit-box cp-modal-box pos-inv-settle-box" role="dialog" aria-modal="true" aria-labelledby="pos-inv-settle-title">
    <div class="staff-credit-head">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
      <span id="pos-inv-settle-title">Payment Details</span>
    </div>
    <div id="pos-inv-settle-error" class="staff-credit-error"></div>
    <div class="staff-field">
      <div class="rt-split-head">
        <label>Payment mode *</label>
        <button type="button" class="rt-link-btn" id="pos-inv-settle-add-split">Split Payment</button>
      </div>
      <div id="pos-inv-settle-splits" class="rt-payment-splits" aria-label="Payment mode splits"></div>
      <div class="rt-split-balance" id="pos-inv-settle-balance" hidden>
        <span>Modes total</span>
        <strong id="pos-inv-settle-split-total" data-amount="0">0</strong>
        <span class="rt-split-vs">of</span>
        <strong id="pos-inv-settle-split-target" data-amount="0">0</strong>
      </div>
    </div>
    <div class="staff-field" id="pos-inv-settle-room-field" hidden>
      <div
        class="se-filter-chip se-filter-chip--payment se-filter-chip--listbox ep-form-listbox ep-combobox-listbox staff-expense-payment-listbox pos-inv-settle-room-listbox"
        data-se-listbox
        data-se-listbox-searchable
        data-se-listbox-combobox
        data-se-listbox-change="onPosSettleHotelRoomChanged"
        id="pos-inv-settle-hotel-room-listbox"
      >
        <span class="se-filter-chip-label" id="pos-inv-settle-hotel-room-label">Hotel room *</span>
        <div class="se-filter-chip-control">
          <span class="se-filter-chip-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
              <path d="M4 21V9a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12"/>
              <path d="M4 21h16"/>
              <path d="M10 21v-5h4v5"/>
              <path d="M8 11h.01"/>
            </svg>
          </span>
          <input type="hidden" id="pos-inv-settle-hotel-room" value="" aria-label="Hotel room for Room Transfer">
          <input type="search"
                 class="se-filter-chip-trigger se-filter-chip-combobox is-placeholder"
                 id="pos-inv-settle-hotel-room-trigger"
                 role="combobox"
                 aria-autocomplete="list"
                 aria-haspopup="listbox"
                 aria-expanded="false"
                 aria-controls="pos-inv-settle-hotel-room-list"
                 aria-labelledby="pos-inv-settle-hotel-room-label"
                 value=""
                 placeholder="Select occupied room…"
                 autocomplete="off"
                 spellcheck="false">
          <span class="se-filter-chip-chev" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none"><polyline points="6 9 12 15 18 9"/></svg>
          </span>
        </div>
        <div class="se-filter-listbox" id="pos-inv-settle-hotel-room-list" role="listbox" aria-labelledby="pos-inv-settle-hotel-room-label" hidden>
          <div class="ep-listbox-options" id="pos-inv-settle-hotel-room-options"></div>
        </div>
      </div>
      <p class="pos-inv-settle-room-hint">Required when paying by Room Transfer — posts to Estimated Charges on that stay.</p>
    </div>
    <div class="staff-field">
      <label for="pos-inv-settle-notes">Notes</label>
      <input id="pos-inv-settle-notes" class="staff-input" type="text" placeholder="Optional remark" autocomplete="off">
    </div>
    <div class="cp-alloc-wrap">
      <div class="cp-alloc-head">
        <span>Bill</span>
        <span id="pos-inv-settle-alloc-meta"></span>
      </div>
      <div class="cp-alloc-table-wrap">
        <table class="cp-alloc-table" aria-label="Bill payment">
          <colgroup>
            <col class="cp-alloc-col-order">
            <col class="cp-alloc-col-total">
            <col class="cp-alloc-col-pay">
          </colgroup>
          <thead>
            <tr>
              <th scope="col">Order</th>
              <th class="pl-col-amount" scope="col">Total</th>
              <th class="pl-col-amount" scope="col">Pay now</th>
            </tr>
          </thead>
          <tbody id="pos-inv-settle-alloc-body"></tbody>
        </table>
      </div>
      <div class="cp-alloc-total">
        <span>Payment total</span>
        <strong id="pos-inv-settle-total" data-amount="0">0</strong>
      </div>
    </div>
    <div class="staff-credit-actions">
      <button type="button" class="btn" data-settle-close>Back</button>
      <button type="button" class="btn btn-primary" id="pos-inv-settle-submit" disabled>Record Payment</button>
    </div>
  </div>
</div>
<script type="application/json" id="pos-inv-payment-methods-data">[["cash","Cash"],["upi","UPI"],["card","Card"],["room_transfer","Room Transfer"],["bank_transfer","Bank Transfer"],["swiggy","Swiggy"],["zomato","Zomato"]]</script>
