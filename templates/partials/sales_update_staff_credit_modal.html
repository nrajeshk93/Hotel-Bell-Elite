<div class="modal-backdrop" id="staff-credit-modal" aria-hidden="true">
  <div class="staff-credit-box sales-expense-modal-box" role="dialog" aria-modal="true" aria-labelledby="staff-credit-title">
    <div class="staff-credit-head">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="1" y="4" width="22" height="16" rx="2"/><path d="M1 10h22"/></svg>
      <span id="staff-credit-title">Employee Credit</span>
    </div>
    <div class="se-expense-available-cash" id="staff-credit-available-wrap">
      <div class="se-expense-available-cash-card" aria-label="Available cash">
        <span class="se-expense-available-cash-label">Available Cash</span>
        <span class="se-expense-available-cash-value" id="staff-credit-available-cash">{{ available_cash|default(0)|inr(0) }}</span>
      </div>
    </div>
    <div id="staff-credit-error" class="staff-credit-error"></div>
    <div class="staff-field">
      <div class="se-filter-chip se-filter-chip--location se-filter-chip--listbox ep-form-listbox ep-combobox-listbox staff-expense-supplier-listbox" data-se-listbox data-se-listbox-searchable data-se-listbox-combobox id="staff-credit-employee-listbox">
        <span class="se-filter-chip-label" id="staff-credit-employee-label">Employee *</span>
        <div class="se-filter-chip-control">
          <span class="se-filter-chip-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          </span>
          <input type="hidden" id="staff-credit-employee" value="">
          <input type="text"
                 class="se-filter-chip-trigger se-filter-chip-combobox is-placeholder"
                 id="staff-credit-employee-trigger"
                 role="combobox"
                 aria-autocomplete="list"
                 aria-haspopup="listbox"
                 aria-expanded="false"
                 aria-controls="staff-credit-employee-list"
                 aria-labelledby="staff-credit-employee-label"
                 value=""
                 placeholder="Select employee"
                 autocomplete="off"
                 spellcheck="false">
          <span class="se-filter-chip-chev" aria-hidden="true">
            <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
          </span>
        </div>
        <div class="se-filter-listbox" id="staff-credit-employee-list" role="listbox" aria-labelledby="staff-credit-employee-label" hidden>
          <div class="ep-listbox-options" id="staff-credit-employee-options">
            {% for employee in credit_employees|default([]) %}
            {% set emp_label = employee.name ~ ((' (' ~ employee.emp_code ~ ')') if employee.emp_code else '') %}
            <button type="button" class="se-filter-listbox-option staff-supplier-option staff-credit-employee-option" role="option" data-value="{{ employee.id }}" data-label="{{ emp_label }}" data-name="{{ employee.name|lower }} {{ (employee.emp_code or '')|lower }} {{ employee.id }}" aria-selected="false">
              <span class="staff-supplier-option-name">{{ employee.name }}</span>
              <span class="staff-supplier-option-gst">{% if employee.emp_code %}{{ employee.emp_code }}{% else %}ID {{ employee.id }}{% endif %}</span>
            </button>
            {% endfor %}
          </div>
        </div>
      </div>
    </div>
    <div class="staff-grid">
      <div class="staff-field staff-field--inline">
        <label for="staff-credit-amount">Amount (₹) *</label>
        <input id="staff-credit-amount" class="staff-input" type="number" min="0.01" step="0.01" placeholder="e.g. 5000">
      </div>
      <div class="staff-field staff-field--inline">
        <label for="staff-credit-description">Description *</label>
        <input id="staff-credit-description" class="staff-input" type="text" placeholder="e.g. Advance, Loan..." autocomplete="off">
      </div>
    </div>
    <div class="staff-credit-actions">
      <button type="button" class="btn staff-primary" id="save-staff-credit">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        <span id="staff-credit-submit-label">Add Credit</span>
      </button>
      <button type="button" class="btn staff-secondary" id="cancel-staff-credit">Cancel</button>
    </div>
    <div class="staff-credit-history">
      <div class="staff-credit-history-head">
        <div class="staff-credit-history-title">Credits for this date</div>
        <div class="staff-credit-history-total" id="staff-credit-history-total">0</div>
      </div>
      <div class="staff-credit-list" id="staff-credit-list"></div>
    </div>
  </div>
</div>
