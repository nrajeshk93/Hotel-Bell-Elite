<script>
(function(){
  var LISTBOX_FORM_SELECTOR = '#room-transfer-filter-form, #cash-ledger-filter-form, #tips-filter-form';
  var DATE_WRAP_BY_FORM = {
    'cash-ledger-filter-form': 'cl-date-range-wrap',
    'room-transfer-filter-form': 'rt-date-range-wrap',
    'tips-filter-form': 'tips-date-range-wrap'
  };

  function closestFilterForm(el){
    return el ? el.closest(LISTBOX_FORM_SELECTOR) : null;
  }

  function closeDatePickerForForm(form){
    if (!form || !window.SalesDateRangePicker) return;
    var wrapId = DATE_WRAP_BY_FORM[form.id];
    if (wrapId && typeof window.SalesDateRangePicker.closeIfOpen === 'function') {
      window.SalesDateRangePicker.closeIfOpen(wrapId);
    }
  }

  function submitScope(root){
    var form = closestFilterForm(root);
    if (!form) return;
    if (typeof window.deSoftSubmitForm === 'function' && window.deSoftSubmitForm(form)) return;
    form.submit();
  }

  function closeListbox(root){
    if (!root) return;
    var trigger = root.querySelector('.se-filter-chip-trigger');
    var list = root.querySelector('.se-filter-listbox');
    root.classList.remove('is-open');
    if (trigger) trigger.setAttribute('aria-expanded', 'false');
    if (list) {
      list.hidden = true;
      list.style.paddingBottom = '';
      list.scrollTop = 0;
    }
  }

  function closeAllListboxes(except){
    document.querySelectorAll(LISTBOX_FORM_SELECTOR + ' [data-se-listbox].is-open').forEach(function(root){
      if (root !== except) closeListbox(root);
    });
  }

  function closeListboxesInForm(formId){
    if (!formId) return;
    document.querySelectorAll('#' + formId + ' [data-se-listbox].is-open').forEach(closeListbox);
  }

  function scrollSelectedToTop(list){
    if (!list) return;
    var selected = list.querySelector('.se-filter-listbox-option.is-selected, .se-filter-listbox-option[aria-selected="true"]');
    if (!selected || selected.classList.contains('is-filtered-out')) return;
    list.style.paddingBottom = '';
    requestAnimationFrame(function(){
      var searchWrap = list.querySelector('.ep-listbox-search-wrap, .pl-supplier-search-wrap, .staff-supplier-search-wrap');
      var topPad = searchWrap ? searchWrap.offsetHeight : 0;
      if (list.scrollHeight <= list.clientHeight + 1) {
        list.scrollTop = 0;
        return;
      }
      var target = Math.max(0, selected.offsetTop - topPad);
      var naturalMax = Math.max(0, list.scrollHeight - list.clientHeight);
      if (target > naturalMax) {
        list.style.paddingBottom = (target - naturalMax) + 'px';
      }
      list.scrollTop = target;
    });
  }

  function openListbox(root){
    if (!root || root.classList.contains('is-disabled')) return;
    closeDatePickerForForm(closestFilterForm(root));
    closeAllListboxes(root);
    var trigger = root.querySelector('.se-filter-chip-trigger');
    var list = root.querySelector('.se-filter-listbox');
    root.classList.add('is-open');
    if (trigger) trigger.setAttribute('aria-expanded', 'true');
    if (list) {
      list.hidden = false;
      var selected = list.querySelector('[aria-selected="true"]') || list.querySelector('.se-filter-listbox-option');
      scrollSelectedToTop(list);
      if (selected) selected.focus({ preventScroll: true });
    }
  }

  function toggleListbox(root){
    if (!root) return;
    if (root.classList.contains('is-open')) closeListbox(root);
    else openListbox(root);
  }

  function selectOption(root, option){
    if (!root || !option) return;
    var input = root.querySelector('input[type="hidden"]');
    var valueEl = root.querySelector('.se-filter-chip-value');
    var list = root.querySelector('.se-filter-listbox');
    var value = option.getAttribute('data-value') || '';
    var label = (option.textContent || '').trim();
    if (input) input.value = value;
    if (valueEl) valueEl.textContent = label;
    if (list) {
      list.querySelectorAll('.se-filter-listbox-option').forEach(function(opt){
        var on = opt === option;
        opt.classList.toggle('is-selected', on);
        opt.setAttribute('aria-selected', on ? 'true' : 'false');
      });
    }
    closeListbox(root);
    submitScope(root);
  }

  function bindListbox(root){
    if (!root || root.__suFilterListboxBound || root.__epListboxBound) return;
    /* Credit / Room Transfer status+outlet use ep_form_listbox.js (data-se-listbox-submit). */
    if (root.id === 'room-transfer-status-listbox' || root.id === 'room-transfer-location-listbox') return;
    root.__suFilterListboxBound = true;
    var trigger = root.querySelector('.se-filter-chip-trigger');
    var list = root.querySelector('.se-filter-listbox');
    if (!trigger || !list) return;
    /* Bind the control that wraps this trigger — not the first .se-filter-chip-control
       under root (Cash Ledger Search is a sibling chip and must not open Outlet). */
    var control = trigger.closest('.se-filter-chip-control') || root.querySelector('.se-filter-chip-control');

    function onTriggerClick(e){
      e.preventDefault();
      e.stopPropagation();
      toggleListbox(root);
    }
    trigger.addEventListener('click', onTriggerClick);
    // Icon / chevron sit outside the button — still open the menu.
    if (control) {
      control.addEventListener('click', function(e){
        if (!root.contains(e.target)) return;
        if (e.target.closest('input, textarea, select, a')) return;
        if (e.target.closest('.se-filter-chip-trigger')) return;
        if (e.target.closest('.se-filter-listbox')) return;
        onTriggerClick(e);
      });
    }
    trigger.addEventListener('keydown', function(e){
      if (e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        openListbox(root);
      } else if (e.key === 'Escape') {
        closeListbox(root);
      }
    });
    list.addEventListener('click', function(e){
      var option = e.target.closest('.se-filter-listbox-option');
      if (!option || !list.contains(option)) return;
      e.preventDefault();
      selectOption(root, option);
    });
    list.addEventListener('keydown', function(e){
      var options = Array.from(list.querySelectorAll('.se-filter-listbox-option'));
      if (!options.length) return;
      var idx = options.indexOf(document.activeElement);
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        options[Math.min(options.length - 1, Math.max(0, idx) + 1)].focus();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        options[Math.max(0, (idx < 0 ? 0 : idx) - 1)].focus();
      } else if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        if (idx >= 0) selectOption(root, options[idx]);
      } else if (e.key === 'Escape') {
        e.preventDefault();
        closeListbox(root);
        trigger.focus();
      } else if (e.key === 'Home') {
        e.preventDefault();
        options[0].focus();
      } else if (e.key === 'End') {
        e.preventDefault();
        options[options.length - 1].focus();
      }
    });
  }

  function initSuFilterListboxes(){
    document.querySelectorAll(LISTBOX_FORM_SELECTOR + ' [data-se-listbox]').forEach(bindListbox);
  }

  initSuFilterListboxes();
  window.initSuFilterListboxes = initSuFilterListboxes;
  window.closeSuFilterListboxes = closeListboxesInForm;

  if (!window.__suFilterListboxDocBound) {
    window.__suFilterListboxDocBound = true;
    document.addEventListener('click', function(e){
      document.querySelectorAll(LISTBOX_FORM_SELECTOR + ' [data-se-listbox].is-open').forEach(function(root){
        if (!root.contains(e.target)) closeListbox(root);
      });
    });
    document.addEventListener('keydown', function(e){
      if (e.key !== 'Escape') return;
      document.querySelectorAll(LISTBOX_FORM_SELECTOR + ' [data-se-listbox].is-open').forEach(closeListbox);
    });
  }
})();
</script>
